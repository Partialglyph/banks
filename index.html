<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IB Math AA SL Practice</title>
<meta name="description" content="Timed practice tests for Grade 11 IB Math AA SL.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
:root{
  --bg:#f7f8fa; --card:#ffffff; --ink:#111827; --muted:#6b7280; --line:#e3e8f0;
  --blue:#0b5bd3; --blue-ink:#ffffff; --blue-soft:#e8eefa; --blue-soft-2:#dbe5f8; --track:#e6ecf7;
  --green:#1f9d55; --red:#e5484d; --amber:#d98a00; --amber-soft:#fff4dc; --amber-ink:#7a5200;
  --shadow:0 1px 2px rgba(17,24,39,.04),0 4px 16px rgba(17,24,39,.06);
  /* figure SVG tokens */
  --fg:var(--ink); --accent:var(--blue); --accent2:#d9622b; --accent-soft:#dbe6fa; --grid:#cfd7e4; --paper:var(--card);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1319; --card:#161c25; --ink:#e7ecf3; --muted:#97a3b4; --line:#262f3c;
    --blue:#5b93ff; --blue-ink:#0b1220; --blue-soft:#1b2638; --blue-soft-2:#22304a; --track:#222c3b;
    --green:#3cbf74; --red:#ff6b6f; --amber:#f0a92a; --amber-soft:#33280f; --amber-ink:#f0c66a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
    --accent2:#ef8a5a; --accent-soft:#1f3150; --grid:#334052;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1319; --card:#161c25; --ink:#e7ecf3; --muted:#97a3b4; --line:#262f3c;
  --blue:#5b93ff; --blue-ink:#0b1220; --blue-soft:#1b2638; --blue-soft-2:#22304a; --track:#222c3b;
  --green:#3cbf74; --red:#ff6b6f; --amber:#f0a92a; --amber-soft:#33280f; --amber-ink:#f0c66a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  --accent2:#ef8a5a; --accent-soft:#1f3150; --grid:#334052;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--blue)}
button{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:16px 24px 48px}

/* top nav */
.nav{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:12px;box-shadow:var(--shadow);
  padding:14px 28px;position:sticky;top:12px;z-index:20}
.logo{font-weight:700;font-size:1.45rem;letter-spacing:-.02em;text-decoration:none;color:var(--ink);margin-right:auto}
.logo b{color:var(--blue)}
.nav a.link{color:var(--ink);text-decoration:none;font-size:.9rem;padding:6px 4px;border-bottom:2px solid transparent}
.nav a.link.on{border-color:var(--blue);color:var(--blue)}
.nav .live{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.nav .live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green)}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;
  display:grid;place-items:center}
.icon-btn svg{width:18px;height:18px}

/* page grid */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:56px;margin-top:40px}
h1{font-size:2rem;line-height:1.2;margin:0 0 14px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:-6px 0 18px}
.progress{display:flex;align-items:center;gap:14px;margin:6px 0 30px}
.track{flex:1;height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.track i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .25s}
.progress span{font-size:.85rem;color:var(--muted);min-width:3em;text-align:right}

/* question */
.qhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin-bottom:4px}
.qhead b{font-weight:700}
.pill{display:inline-block;font-size:.75rem;font-weight:500;padding:2px 9px;border-radius:99px;background:var(--blue-soft);color:var(--blue)}
.pill.est{background:var(--amber-soft);color:var(--amber-ink)}
.qbody{text-align:justify}
.qbody .p{margin:8px 0}
.qbody .p.sub{padding-left:26px}
.gap{display:inline-block;width:1.4em}
.mk{display:inline-block;font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:4px;vertical-align:1px;white-space:nowrap}
em.note{background:var(--amber-soft);color:var(--amber-ink);padding:1px 6px;border-radius:5px;font-size:.88em}
figure{margin:14px 0;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.fig-row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.fig-cell{display:flex;flex-direction:column;gap:4px;max-width:100%}
.fig-svg svg{max-width:100%;height:auto;display:block}
.fig-cell img{max-width:100%;max-height:320px;height:auto;display:block;border-radius:4px;background:#fff}
.fig-tag{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
figcaption{font-size:.8rem;color:var(--muted);margin-top:8px;text-align:left}
table{border-collapse:collapse;margin:8px 0}
th,td{border:1px solid var(--line);padding:4px 12px;text-align:center}
details.src{margin:12px 0 22px;font-size:.88rem}
details.src summary{color:var(--blue);font-weight:700;text-decoration:underline;cursor:pointer;list-style:none;display:inline}
details.src summary::-webkit-details-marker{display:none}
details.src p{margin:6px 0 0;color:var(--muted)}

/* option rows (theme's answer rows) */
.opts{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid transparent;background:var(--blue-soft);
  border-radius:6px;padding:12px 14px;cursor:pointer;font-size:.92rem}
.opt:hover{background:var(--blue-soft-2)}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--card)}
.opt .ic{flex:none}
textarea.notes{width:100%;min-height:96px;resize:vertical;border:1.5px solid transparent;background:var(--blue-soft);border-radius:6px;
  padding:12px 14px;font:inherit;font-size:.92rem;color:var(--ink)}
textarea.notes:focus{outline:none;border-color:var(--blue);background:var(--card)}
.actions{display:flex;justify-content:flex-end;gap:12px;margin-top:30px}
.btn{border:1.5px solid var(--blue);background:var(--blue);color:var(--blue-ink);font-weight:500;border-radius:6px;padding:9px 0;min-width:116px;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--blue)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.wide{padding:12px 28px}

/* sidebar */
aside{display:flex;flex-direction:column;gap:12px;min-width:0}
.score{background:var(--blue-soft);border-radius:10px;padding:24px 16px;text-align:center;margin-bottom:14px}
.score .big{font-size:2rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.score .small{font-size:.8rem;color:var(--muted);margin-top:4px}
.score.warn .big{color:var(--amber)}
.score.danger .big{color:var(--red)}
.qlist{display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 290px);overflow:auto;padding:2px}
.qrow{display:flex;align-items:center;gap:10px;background:var(--blue-soft);border:1.5px solid transparent;border-radius:6px;padding:7px 10px;
  font-size:.82rem;cursor:pointer;text-align:left;width:100%}
.qrow.cur{border-color:var(--blue);background:var(--card)}
.qrow.idle{color:var(--muted)}
.qrow .m{margin-left:auto;font-size:.72rem;color:var(--muted)}
.ic{width:18px;height:18px;display:block}

/* setup */
.section-label{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:28px 0 12px}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.topic{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--blue-soft);border:1.5px solid transparent;border-radius:8px;padding:14px;cursor:pointer}
.topic[aria-pressed="true"]{border-color:var(--blue);background:var(--card)}
.topic .box{flex:none;width:18px;height:18px;border-radius:4px;border:1.5px solid var(--muted);margin-top:2px;display:grid;place-items:center}
.topic[aria-pressed="true"] .box{background:var(--blue);border-color:var(--blue)}
.topic[aria-pressed="true"] .box::after{content:"";width:9px;height:5px;border:2px solid var(--blue-ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.topic strong{display:block;font-weight:500}
.topic span{font-size:.8rem;color:var(--muted)}
.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
input[type=range]{flex:1;min-width:180px;accent-color:var(--blue)}
.num{width:76px;padding:8px 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit;text-align:center}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:4px 14px;font-size:.85rem;cursor:pointer}
.chip.on{border-color:var(--blue);color:var(--blue)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;cursor:pointer;margin-top:16px}
.check input{accent-color:var(--blue);margin-top:4px}
.summary{display:flex;gap:28px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 20px;margin-top:28px}
.summary div{display:flex;flex-direction:column}
.summary b{font-size:1.35rem;font-variant-numeric:tabular-nums}
.summary small{color:var(--muted);font-size:.78rem}
.alert{margin-top:14px;padding:10px 14px;border-radius:8px;background:var(--amber-soft);color:var(--amber-ink);font-size:.88rem}
.banner{display:flex;align-items:center;gap:16px;justify-content:space-between;background:var(--blue-soft);border-radius:10px;padding:14px 18px;margin-bottom:26px;flex-wrap:wrap}
.hist{display:flex;flex-direction:column;gap:10px}
.hist .qrow{cursor:default}
.empty{color:var(--muted);font-size:.85rem}

/* results + bank */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:14px}
.card header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card header .meta{color:var(--muted);font-size:.82rem}
.award{display:flex;align-items:center;gap:8px;margin-left:auto}
.award .num{width:64px;padding:6px}
.award .chip{padding:3px 10px;font-size:.8rem}
.card details>summary{cursor:pointer;color:var(--blue);font-size:.85rem;margin-top:10px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.search{flex:1;min-width:220px;padding:10px 14px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.paper{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
.paper>summary{cursor:pointer;padding:14px 18px;display:flex;justify-content:space-between;gap:12px;font-weight:500}
.paper>summary span{color:var(--muted);font-weight:400;font-size:.85rem;white-space:nowrap}
.paper .inner{padding:0 18px 6px}
.paper article{border-top:1px solid var(--line);padding:14px 0}
.paper h4.sec{margin:18px 0 6px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent2)}
.bank-q header{display:flex;gap:8px;align-items:center;margin-bottom:2px}
.bank-q header b{font-size:.92rem}

dialog{border:none;border-radius:12px;padding:24px;max-width:400px;width:calc(100% - 32px);background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,15,25,.45)}
dialog h3{margin:0 0 8px}
dialog p{margin:0 0 18px;color:var(--muted)}
.foot{color:var(--muted);font-size:.78rem;text-align:center;margin-top:56px}
.only-narrow{display:none}

@media (max-width:900px){
  .grid{grid-template-columns:1fr;gap:28px;margin-top:24px}
  .qlist{max-height:none}
  .only-narrow{display:inline-block}
  .nav{padding:12px 16px;gap:12px}
  .wrap{padding:12px 16px 40px}
  h1{font-size:1.6rem}
}
.nav a.link{white-space:nowrap}
/* minimal */
body{background:var(--card)}
.nav{position:static;box-shadow:none;border-radius:0;background:transparent;border-bottom:1px solid var(--line);padding:14px 0;gap:22px}
.nav .spacer{margin-left:auto}
.icon-btn{border:none;background:transparent;color:var(--muted)}
h1{font-size:1.6rem;font-weight:600}
.score{background:transparent;border:1px solid var(--line)}
.opt,.topic,.qrow,textarea.notes{background:transparent;border:1px solid var(--line)}
.opt:hover,.topic:hover{background:var(--bg)}
.opt[aria-pressed="true"],.topic[aria-pressed="true"],.qrow.cur{border-color:var(--blue)}
.pill{background:transparent;border:1px solid var(--line);color:var(--muted)}
.pill.est{background:transparent;border-color:var(--amber);color:var(--amber-ink)}
.summary,.card,.paper{border-color:var(--line);background:transparent}
.banner{background:transparent;border:1px solid var(--line)}
.alert{background:transparent;border:1px solid var(--amber);color:var(--ink)}
figure{background:transparent}
.disclaimer{color:var(--muted);font-size:.78rem;border-top:1px solid var(--line);margin-top:56px;padding-top:16px;text-align:center}
.pause{margin-top:12px;background:none;border:1px solid var(--line);border-radius:6px;padding:4px 14px;font-size:.8rem;cursor:pointer;color:var(--ink)}
.paused-cover{border:1px dashed var(--line);border-radius:8px;padding:48px 16px;text-align:center;color:var(--muted)}
#gate{position:fixed;inset:0;z-index:100;background:var(--card);display:grid;place-items:center;padding:16px}
#gate form{width:100%;max-width:320px;display:flex;flex-direction:column;gap:12px}
#gate label{font-weight:500}
#gate input{padding:10px 12px;border:1px solid var(--line);border-radius:6px;font:inherit;background:var(--card);color:var(--ink);letter-spacing:.2em}
#gate small{color:var(--muted)}
#gate .err{color:var(--red);min-height:1.2em;font-size:.85rem}
body.locked .wrap{display:none}
@media (max-width:520px){
  .nav{gap:10px;padding:10px 14px}
  .logo{font-size:1.2rem}
  .nav a.link{font-size:.82rem}
  .nav .long{display:none}
  .icon-btn{width:32px;height:32px}
  .qbody{text-align:left}
  .actions .btn{flex:1;min-width:0}
}
</style>
</head>

:"<p class=\"p\">Solve and write the solution in interval notation: $\\dfrac{5x}{x+2} &lt; -1$. <span class=\"mk\">[6]<\/span><\/p>","text":" solve and write the solution in interval notation: dfrac 5x x+2 < -1 . [6] "},{"id":"c1p1q5","ch":0,"paper":"Ch 1 Test 2021–2022","section":"","num":5,"marks":5,"est":false,"html":"<p class=\"p part\">(a) Show that $(2n-1)^2 + (2n+1)^2 = 8n^2 + 2$, where $n \\in \\mathbb{Z}$. <span class=\"mk\">[2]<\/span><\/p>\n<p class=\"p part\">(b) Hence, or otherwise, prove that the sum of the squares of any two consecutive odd integers is even. <span class=\"mk\">[3]<\/span><\/p>","text":" (a) show that (2n-1)^2 + (2n+1)^2 = 8n^2 + 2 , where n in mathbb z . [2] (b) hence, or otherwise, prove that the sum of the squares of any two consecutive odd integers is even. [3] "},{"id":"c1p1q6","ch":0,"paper":"Ch 1 Test 2021–2022","section":"","num":6,"marks":5,"est":false,"html":"<p class=\"p\">Solve $x + 2 \\le |3x - 4|$. <span class=\"mk\">[5]<\/span><\/p>","text":" solve x + 2 le |3x - 4| . [5] "},{"id":"c1p1q7","ch":0,"paper":"Ch 1 Test 2021–2022","section":"","num":7,"marks":8,"est":false,"html":"<p class=\"p\">A farmer has 480 metres of fencing with which to build two animal pens with a common side. A diagram of the enclosure is shown.<\/p>\n<figure id=\"fig-c1_2122_q7\"><div class=\"fig-row\"><div class=\"fig-cell\"><div class=\"fig-svg\"><svg xmlns=\"http://www.w3.org/2000/svg\" class=\"dg\" viewBox=\"0 0 280 160\" width=\"280\" role=\"img\"><style>.gr{stroke:var(--grid,#c9d1d8);stroke-width:.7;stroke-dasharray:2 2}.ax{stroke:var(--fg,#1d2329);stroke-width:1.2}.ahd{fill:var(--fg,#1d2329)}.c1{fill:none;stroke:var(--accent,#1f6f78);stroke-width:2;stroke-linejoin:round}.c2{fill:none;stroke:var(--accent2,#b5562a);stroke-width:2;stroke-dasharray:6 4}.as{stroke:var(--muted,#5f6b76);stroke-width:1;stroke-dasharray:4 4}.sh{fill:var(--accent-soft,#e3f0f1);stroke:none}.dt{fill:var(--accent,#1f6f78)}.dto{fill:var(--paper,#fff);stroke:var(--accent2,# ":2,"marks":6,"est":false,"html":"<p class=\"p\">The fifth term of an arithmetic sequence is equal to 6 and the sum of the first twelve terms is 45. Find the first term and the common difference. <span class=\"mk\">[6]<\/span><\/p>","text":" the fifth term of an arithmetic sequence is equal to 6 and the sum of the first twelve terms is 45. find the first term and the common difference. [6] "},{"id":"c1p2q3","ch":0,"paper":"Ch 1 Test 2022–2023","section":"","num":3,"marks":6,"est":false,"html":"<p class=\"p\">Consider the function $f(x) = 2x^2 + 12x + 5$.<\/p>\n<p class=\"p part\">(a) Write $f(x)$ in the form $f(x) = a(x-h)^2 + k$. <span class=\"mk\">[4]<\/span><\/p>\n<p class=\"p part\">(b) Write down the coordinates of the vertex. <span class=\"mk\">[2]<\/span><\/p>","text":" consider the function f(x) = 2x^2 + 12x + 5 . (a) write f(x) in the form f(x) = a(x-h)^2 + k . [4] (b) write down the coordinates of the vertex. [2] "},{"id":"c1p2q4","ch":0,"paper":"Ch 1 Test 2022–2023","section":"","num":4,"marks":11,"est":false,"html":"<p class=\"p\">The following diagram shows part of the graph of a quadratic function $f$.<\/p>\n<figure id=\"fig-c1_2223_q4\"><div class=\"fig-row\"><div class=\"fig-cell\"><div class=\"fig-svg\"><svg xmlns=\"http://www.w3.org/2000/svg\" class=\"dg\" viewBox=\"0 0 300 343\" width=\"300\" role=\"img\"><style>.gr{stroke:var(--grid,#c9d1d8);stroke-width:.7;stroke-dasharray:2 2}.ax{stroke:var(--fg,#1d2329);stroke-width:1.2}.ahd{fill:var(--fg,#1d2329)}.c1{fill:none;stroke:var(--accent,#1f6f78);stroke-width:2;stroke-linejoin:round}.c2{fill:none;stroke:var(--accent2,#b5562a);stroke-width:2;stroke-dasharray:6 4}.as{stroke:var(--muted,#5f6b76);stroke-width:1;stroke-dasharray:4 4}.sh{fill:var(--accent-soft,#e3f0f1);stroke:none}.dt{fill:var(--accent,#1f6f78)}.dto{fill:var(--paper,#fff);stroke:var(--accent2,#b5562a);stroke-width:1.5}.lb{fill:var(--fg,#1d2329);font:13px system-ui,sans-serif}.it{font-style:italic;font-family:Georgia,serif}.tk{fill:var(--mu "fig-svg\"><svg xmlns=\"http://www.w3.org/2000/svg\" class=\"dg\" viewBox=\"0 0 360 150\" width=\"360\" role=\"img\"><style>.gr{stroke:var(--grid,#c9d1d8);stroke-width:.7;stroke-dasharray:2 2}.ax{stroke:var(--fg,#1d2329);stroke-width:1.2}.ahd{fill:var(--fg,#1d2329)}.c1{fill:none;stroke:var(--accent,#1f6f78);stroke-width:2;stroke-linejoin:round}.c2{fill:none;stroke:var(--accent2,#b5562a);stroke-width:2;stroke-dasharray:6 4}.as{stroke:var(--muted,#5f6b76);stroke-width:1;stroke-dasharray:4 4}.sh{fill:var(--accent-soft,#e3f0f1);stroke:none}.dt{fill:var(--accent,#1f6f78)}.dto{fill:var(--paper,#fff);stroke:var(--accent2,#b5562a);stroke-width:1.5}.lb{fill:var(--fg,#1d2329);font:13px system-ui,sans-serif}.it{font-style:italic;font-family:Georgia,serif}.tk{fill:var(--muted,#5f6b76);font:11px ui-monospace,monospace}<\/style><defs><marker id=\"ah\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0L8,4L0,8z\" class=\"ahd\"/><\/marker><\/defs><path class=\"sh\" d=\"M95,20 L265,20 L265,130 L95,130 Z\"/><path class=\"c1\" d=\"M95,20 L265,20 A55,55 0 0 1 265,130 L95,130 A55,55 0 0 1 95,20 Z\"/><line class=\"as\" x1=\"95.0\" y1=\"20.0\" x2=\"95.0\" y2=\"130.0\"/><line class=\"as\" x1=\"265.0\" y1=\"20.0\" x2=\"265.0\" y2=\"130.0\"/><line class=\"c2\" x1=\"265.0\" y1=\"75.0\" x2=\"320.0\" y2=\"75.0\"/><text class=\"lb it\" x=\"180.0\" y=\"14.0\" text-anchor=\"middle\">l<\/text><text class=\"lb it\" x=\"292.5\" y=\"70.0\" text-anchor=\"middle\">r<\/text><\/svg><\/div><span class=\"fig-tag\">Redrawn<\/span><\/div><\/div><figcaption>Redrawn: straight sections of length l, semicircular ends of radius r. The rectangle inside the track is shaded.<\/figcaption><\/figure>\n<p class=\"p part\">(a) Show that the area, $A$, of the rectangular region enclosed by the track can be written as $A = 400r - 2\\pi r^2$. <span class=\"mk\">[3]<\/span><\/p>\n<p class=\"p part\">(b) Hence, find the value of $l$ that maximizes $A$. <span class=\"mk\">[4]<\/span><\/p>","text":" a running track with semi-circular ends has a perimeter of 400 m. let l be the length of each of the straight sections of the track and let r be the radius of the semi-circular ends. figure (c1_2223_q7): redrawn: straight sections of length l, semicircular ends of radius r. the rectangle inside the track is shaded. (a) show that the area, a , of the rectangular region enclosed by the track can be written as a = 400r - 2 pi r^2 . [3] (b) hence, find the value of l that maximizes a . [4] "},{"id":"c1p2q8","ch":0,"paper":"Ch 1 Test 2022–2023","section":"","num":8,"marks":7,"est":false,"html":"<p class=\"p\">Solve $\\left|\\dfrac{x}{x+1}\\right| \\ge 2$. <span class=\"mk\">[7]<\/span><\/p>","text":" solve left| dfrac x x+1 right| ge 2 . [7] "},{"id":"c1p2q9","ch":0,"paper":"Ch 1 Test 2022–2023","section":"","num":9,"marks":12,"est":false,"html":"<p class=\"p\"><em class=\"note\">(Stem partly hidden under handwriting on the scan — reconstructed from what's legible and the working; check against the original.)<\/em> Consider the quadratic function $f(x) = a(x-p)(x+p)$, where $p &gt; 0$. The graph of $f$ passes through the points $(0, -9)$ and $(1, -5)$.<\/p>\n<p class=\"p part\">(a) Show that $a = \\dfrac{9}{p^2}$. <span class=\"mk\">[2]<\/span><\/p>\n<p class=\"p part\">(b) Hence, find the values of $a$ and $p$. <span class=\"mk\">[4]<\/span><\/p>\n<p class=\"p part\">(c) The line $y = -4mx - (9 - m)$ intersects the graph of $f$ in two points. Find the range of values of $m$. <span class=\"mk\">[6]<\/span><\/p>","text":" (stem partly hidden under handwriting on the scan — reconstructed from what's legible and the working; check against the original.) consider the quadratic function f(x) = a(x-p)(x+p) , where p > 0 . the graph of f passes through the points (0, -9) and (1, -5) . (a) show that a = dfrac 9 p^2 . [2] (b) hence, find the values of a and p . [4] (c) the line y = -4mx - (9 - m) intersects the graph of f in two points. find the range of values of m . [6] "},{"id":"c1p3q1","ch":0,"paper":"Ch 1 Test 2024–2025","section":"","num":1,"marks":6,"est":false,"html":"<p class=\"p\">Find (in any form) the equation of the quadratic whose graph: <span class=\"mk\">[6]<\/span><\/p>\n<p class=\"p part\">(a) has $x$-intercepts at $x = 1, 5$ and passes through the point $(2, -9)$;<\/p>\n<p class=\"p part\">(b) has vertex $(2, -3)$ and has $y$-intercept $y = 5$.<\/p>","text":" find (in any form) the equation of the quadratic whose graph: [6] (a) has x -intercepts at x = 1, 5 and passes through the point (2, -9) ; (b) has vertex (2, -3) and has y -intercept y = 5 . "},{"id":"c1p3q2","ch":0,"paper":"Ch 1 Test 2024–2025","section":"","num":2,"marks":4,"est":false,"html":"<p class=\"p\">The second term of an arithmetic sequence is 10 and the fourth term is 22.<\/p>\n<p class=\"p part\">(a) Find the value of the common difference. <span class=\"mk\">[2]<\/span><\/p>\n<p class=\"p part\">(b) Find an expression for $u_n$, the $n$th term. <span class=\"mk\">[2]<\/span><\/p>","text":" the second term of an arithmetic sequence is 10 and the fourth term is 22. (a) find the value of the common difference. [2] (b) find an expression for u_n , the n th term. [2] "},{"id":"c1p3q3","ch":0,"paper":"Ch 1 Test 2024–2025","section":"","num":3,"marks":6,"est":false,"html":"<p class=\"p\">Solve the following inequalities: <span class=\"mk\">[6]<\/span><\/p>\n<p class=\"p part\">(a) $x^2 \\ge 4x$<\/p>\n<p class=\"p part\">(b) $x^2 - 11x + 30 \\le 0$<\/p>\n<p class=\"p part\">(c) $2x^2 + 9 &gt; 9x$<\/p>","text":" solve the following inequalities: [6] (a) x^2 ge 4x (b) x^2 - 11x + 30 le 0 (c) 2x^2 + 9 > 9x "},{"id":"c1p3q4","ch":0,"paper":"Ch 1 Test 2024–2025","section":"","num":4,"marks":5,"est":false,"html":"<p class=\"p\">Solve the following equations:<\/p>\n<p class=\"p part\">(a) $\\sqrt{2x-3} = 7$ <span class=\"mk\">[2]<\/span><\/p>\n<p class=\"p part\">(b) $5 + \\sqrt{x+7} = x$ <span class=\"mk\">[3]<\/span><\/p>","text":" solve the following equations: (a) sqrt 2x-3 = 7 [2] (b) 5 + sqrt x+7 = x [3] "},{"id":"c1p3q5","ch":0,"paper":"Ch 1 Test 2024–2025","section":"","num":5,"marks":6,"est":false,"html":"<p class=\"p\">If Bob wants to build a garden with 100 m of fencing, find the dimensions of the garden that will maximize the area when one side of the garden is along the house. <span class=\"mk\">[6]<\/span><\/p>","text":" if bob wants to build a garden with 100 m of fencing, find the dimensions of the garden that will maximize the area when one side of the garden is along the house. [6] "},{"id":"c1p3q6","ch":0,"paper":"Ch 1 Test 2024–2025","section":"","num":6,"marks":7,"est":false,"html":"<p class=\"p part\">(a) Prove that $2 - \\dfrac{4}{m+1} + \\dfrac{1}{(m+1)^2} = \\dfrac{2m^2 - 1}{(m+1)^2}$ for $m \\ne -1$. <span class=\"mk\">[3]<\/span><\/p>\n<p class=\"p part\">(b) Hence, or otherwise, solve $2 - \\dfrac{4}{m+1} + \\dfrac{1}{(m+1)^2} &gt; 0$. Express your answer in interval notation. <span class=\"mk\">[4]<\/span><\/p>","text":" (a) prove that 2 - dfrac 4 m+1 + dfrac 1 (m+1)^2 = dfrac 2m^2 - 1 (m+1)^2 for m ne -1 . [3] (b) hence, or otherwise, solve 2 - dfrac 4 m+1 + dfrac 1 (m+1)^2 > 0 . express your answer in interval notation. [4] "},{"id":"c1p3q7","ch":0,"paper":"Ch 1 Test 2024–2025","section":"","num":7,"marks":6,"est":false,"html":"<p class=\"p\">Solve $2 \\le |x^2 - 9| &lt; 9$. <span class=\"mk\">[6]<\/span><\/p>","text":" solve 2 le |x^2 - 9| < 9 . [6] "},{"id":"c1p3q8","ch":0,"paper":"Ch 1 Test 2024–2025","section":"","num":8,"marks":8,"est":false,"html":"<p class=\"p\">Let $f(x) = x^2 + 2x - 2k$ and $g(x) = 9 - kx$. The graphs of $f$ and $g$ intersect at most once. Find the possible values of $k$. <span class=\"mk\">[8]<\/span><\/p>","text":" let f(x) = x^2 + 2x - 2k and g(x) = 9 - kx . the graphs of f and g intersect at most once. find the possible values of k . [8] "},{"id":"c1p3q9","ch":0,"paper":"Ch 1 Test 2024–2025","section":"","num":9,"marks":12,"est":false,"ht \">[5]<\/span><\/p>","text":" let f(x) = dfrac x+a x+b where a, b in mathbb z . the graph of y = f(x) is shown below. figure (c2_2324_q7): redrawn from the scan: asymptotes x = 2 and y = 1, intercepts (0, 2) and (4, 0). (a) write down the values of a and b . [2] let g(x) = kx - k where k in mathbb r . (b) when k = 1 , add the graph of y = g(x) to the diagram above. [2] (c) find the restrictions on the value of k if the graphs of y = f(x) and y = g(x) intersect twice. [5] "},{"id":"c2p1q8","ch":1,"paper":"Graphing and Polynomials Test 2023–2024","section":"","num":8,"marks":14,"est":false,"html":"<p class=\"p\">The function $f$ is defined by $f(x) = \\dfrac{4x+1}{x+4}$, where $x \\in \\mathbb{R}$, $x \\ne -4$. <em class=\"note\">(paper prints \"$x \\ne 4$\" — almost certainly a typo)<\/em><\/p>\n<p class=\"p part\">(a) For the graph of $f$, <span class=\"mk\">[3]<\/span><\/p>\n<p class=\"p sub\">i. write down the equation of the vertical asymptote;<\/p>\n<p class=\"p sub\">ii. find the equation of the horizontal asymptote.<\/p>\n<p class=\"p part\">(b) Find $f^{-1}(x)$. <span class=\"mk\">[4]<\/span><\/p>\n<p class=\"p part\">(c) Using an algebraic approach, show that the graph of $f^{-1}$ is obtained by a reflection of the graph of $f$ in the $y$-axis followed by a reflection in the $x$-axis. <span class=\"mk\">[4]<\/span><\/p>\n<p class=\"p\">The graphs of $f$ and $f^{-1}$ intersect at $x = p$ and $x = q$, where $p &lt; q$.<\/p>\n<p class=\"p part\">(d) Find the value of $p$ and the value of $q$. <span class=\"mk\">[3]<\/span><\/p>","text":" the function f is defined by f(x) = dfrac 4x+1 x+4 , where x in mathbb r , x ne -4 . (paper prints \" x ne 4 \" — almost certainly a typo) (a) for the graph of f , [3] i. write down the equation of the vertical asymptote; ii. find the equation of the horizontal asymptote. (b) find f^ -1 (x) . [4] (c) using an algebraic approach, show that the graph of f^ -1 is obtained by a reflection of the graph of f in the y -axis followed by a reflection in the x -axis. [4] the graphs of f and f^ -1 intersect at x = p and x = q , where p < q . (d) find the value of p and the value of q . [3] "},{"id":"c2p1q9","ch":1,"paper":"Graphing and Polynomials Test 2023–2024","section":"","num":9,"marks":9,"est":false,"html":"<p class=\"p\">A <strong>functional square root<\/strong> of a function $g(x)$ is a function $f(x)$ such that $(f \\circ f)(x) = g(x)$ for all $x$ in the domain of $g(x)$.<\/p>\n<p class=\"p part\">(a) Show that $f(x) = x^2 + 1$ is a functional square root of $g(x) = x^4 + 2x^2 + 2$. <span class=\"mk\">[2]<\/span><\/p>\n<p class=\"p part\">(b) Write down a functional square root for each of the following functions: <span class=\"mk\">[2]<\/span><\/p>\n<p class=\"p sub\">i. $g(x) = x + 2$<span class=\"gap\"><\/span>ii. $g(x) = x^9$<\/p>\n<p class=\"p part\">(c) Determine a functional square root of $g(x) = 27x^4 + 18x^3 - 30x^2 - 11x + 8$ by using an algebraic method. <span class=\"mk\">[5]<\/span><\/p>","text":" a functional square root of a function g(x) is a function f(x) such that (f circ f)(x) = g(x) for all x in the domain of g(x) . (a) show that f(x) = x^2 + 1 is a functional square root of g(x) = x^4 + 2x^2 + 2 . [2] (b) write down a functional square root for each of the following functions: [2] i. g(x) = x + 2 ii. g(x) = x^9 (c) determine a functional square root of g(x) = 27x^4 + 18x^3 - 30x^2 - 11x + 8 by using an algebraic method. [5] "},{"id":"c2p2q1","ch":1,"paper":"Graphing and Polynomials Test 2024–2025","section":"","num":1,"marks":5,"est":false,"html":"<p class=\"p\">The graph of $y = f(x)$ for $0 \\le x \\le 10$ is shown in the following diagram. The graph intercepts the axes at $(10, 0)$ and $(0, 5)$.<\/p>\n<figure id=\"fig-c2_2425_q1\"><div class=\"fig-row\"><div class=\"fig-cell\"><div class=\"fig-svg\"><svg xmlns=\"http://www.w3.org/2000/svg\" class=\"dg\" viewBox=\"0 0 300 300\" width=\"300\" role=\"img\"><style>.gr{stroke:var(--grid,#c9d1d8);stroke-width:.7;stroke-d 24 paper. (a) on the graph above, sketch the graph of y = f(x-1) + 2 . [2] (b) find g(x) in terms of f(x) . [2] "},{"id":"c2p2q3","ch":1,"paper":"Graphing and Polynomials Test 2024–2025","section":"","num":3,"marks":7,"est":false,"html":"<p class=\"p\">On January 1st, 2025, the Faber Car Company will release a new car to global markets. The company expects to sell 40 cars in January 2025. The number of cars sold each month can be modelled by a geometric sequence where $r = 1.1$.<\/p>\n<p class=\"p part\">(a) Use this model to find the number of cars that will be sold in December 2025. <span class=\"mk\">[2]<\/span><\/p>\n<p class=\"p part\">(b) Use this model to find the total number of cars that will be sold in the year 2025. <span class=\"mk\">[2]<\/span><\/p>\n<p class=\"p part\">(c) Use this model to find the total number of cars that will be sold in the year 2026. <span class=\"mk\">[3]<\/span><\/p>","text":" on january 1st, 2025, the faber car company will release a new car to global markets. the company expects to sell 40 cars in january 2025. the number of cars sold each month can be modelled by a geometric sequence where r = 1.1 . (a) use this model to find the number of cars that will be sold in december 2025. [2] (b) use this model to find the total number of cars that will be sold in the year 2025. [2] (c) use this model to find the total number of cars that will be sold in the year 2026. [3] "},{"id":"c2p2q4","ch":1,"paper":"Graphing and Polynomials Test 2024–2025","section":"","num":4,"marks":8,"est":false,"html":"<p class=\"p\">The graph of $y = f(x)$ has axes intercepts at $(6, 0)$ and $(0, 4)$ and asymptotes at $x = 2$ and $y = -8$. Determine the coordinates of the axes intercepts and equations of asymptotes for the following graphs:<\/p>\n<p class=\"p part\">(a) $y = -f(x)$ <span class=\"mk\">[4]<\/span><\/p>\n<p class=\"p part\">(b) $y = f(2x)$ <span class=\"mk\">[4]<\/span><\/p>","text":" the graph of y = f(x) has axes intercepts at (6, 0) and (0  equation $f(x) = g(x)$ has <span class=\"mk\">[8]<\/span><\/p>\n<p class=\"p sub\">i. one solution;<span class=\"gap\"><\/span>ii. two solutions.<\/p>\n<p class=\"p part\">(c) Prove your answers to part (b) algebraically. <span class=\"mk\">[7]<\/span><\/p>","text":" let f(x) = |mx| where m in mathbb r and g(x) = |x - 2| . (a) find the expanded expressions for (x-2)^2 and (-x+2)^2 . [2] (b) by sketching graphs of y = f(x) and y = g(x) , determine the restrictions on the value of m if the equation f(x) = g(x) has [8] i. one solution; ii. two solutions. (c) prove your answers to part (b) algebraically. [7] "},{"id":"c2p2q8","ch":1,"paper":"Graphing and Polynomials Test 2024–2025","section":"","num":8,"marks":16,"est":false,"html":"<p class=\"p\">Let $f(x) = \\dfrac{2x-1}{x-1}$ and $g(x) = \\dfrac{1}{x}$.<\/p>\n<p class=\"p part\">(a) Show that $2 + \\dfrac{1}{x-1} = \\dfrac{2x-1}{x-1}$. <span class=\"mk\">[2]<\/span><\/p>\n<p class=\"p part\">(b) Hence, describe the transformations that map the graph of $y = f(x)$ onto $y = g(x)$. <span class=\"mk\">[3]<\/span><\/p>\n<p class=\"p\">Let $h(x) = f(x+k) + k$.<\/p>\n<p class=\"p part\">(c) Show that $h^{-1}(x) = \\dfrac{1}{x-2-k} - k + 1$. <span class=\"mk\">[4]<\/span><\/p>\n<p class=\"p part\">(d) Determine the value of $k$ so that $h(x) = h^{-1}(x)$. <span class=\"mk\">[2]<\/span><\/p>\n<p class=\"p part\">(e) Hence, calculate the distance between a line of symmetry of the graph of $y = h(x)$ and a parallel line of symmetry of the graph of $y = g(x)$. <span class=\"mk\">[5]<\/span><\/p>","text":" let f(x) = dfrac 2x-1 x-1 and g(x) = dfrac 1 x . (a) show that 2 + dfrac 1 x-1 = dfrac 2x-1 x-1 . [2] (b) hence, describe the transformations that map the graph of y = f(x) onto y = g(x) . [3] let h(x) = f(x+k) + k . (c) show that h^ -1 (x) = dfrac 1 x-2-k - k + 1 . [4] (d) determine the value of k so that h(x) = h^ -1 (x) . [2] (e) hence, calculate the distance between a line of symmetry of the graph of y = h(x) and a parallel line of symmetry of the graph of y = g(x) . [5] "},{"id":"c3p1q1","ch":2,"paper":"Logarithmics Test 2021–2022","section":"","num":1,"marks":5,"est":false,"html":"<p class=\"p\">Solve the equation $9^x = 27^{2-2x}$. <span class=\"mk\">[5]<\/span><\/p>","text":" solve the equation 9^x = 27^ 2-2x . [5] "},{"id":"c3p1q2","ch":2,"paper":"Logarithmics Test 2021–2022","section":"","num":2,"marks":6,"est":false,"html":"<p class=\"p part\">(a) Write down the value of $\\log_3 27$. <span class=\"mk\">[1]<\/span><\/p>\n<p class=\"p part\">(b) Write down the value of $\\log_8 \\tfrac{1}{8}$. <span class=\"mk\">[1]<\/span><\/p>\n<p class=\"p part\">(c) Write down the value of $\\log_{16} 4$. <span class=\"mk\">[1]<\/span><\/p>\n<p class=\"p part\">(d) Hence, or otherwise, solve $\\log_3 27 + \\log_8 \\tfrac{1}{8} + \\log_{16} 4 = \\log_4 x$. <span class=\"mk\">[3]<\/span><\/p>","text":" (a) write down the value of log_3 27 . [1] (b) write down the value of log_8 tfrac 1 8 . [1] (c) write down the value of log_ 16 4 . [1] (d) hence, or otherwise, solve log_3 27 + log_8 tfrac 1 8 + log_ 16 4 = log_4 x . [3] "},{"id":"c3p1q3","ch":2,"paper":"Logarithmics Test 2021–2022","section":"","num":3,"marks":6,"est":false,"html":"<p class=\"p\"><strong>In this question, give all answers to two decimal places.<\/strong> Karl invests 1000 USD in an account that pays a nominal annual interest of 3.5%, compounded quarterly. He leaves the money in the account for 5 years.<\/p>\n<p class=\"p part\">(a) Calculate the amount of money he has in the account after 5 years. <span class=\"mk\">[3]<\/span><\/p>\n<p class=\"p part\">(b) Write down the amount of interest he earned after 5 years. <span class=\"mk\">[1]<\/span><\/p>\n<p class=\"p part\">(c) Karl decides to donate this interest to a charity in France. The charity receives 170 euros (EUR). The exchange rate is 1 USD = $t$ EUR. Calculate the value of $t$. <span class=\"mk\">[2]<\/span><\/p>","text":" in this question, give all answers to two decimal places. karl invests 1000 usd in an account that pays a nominal annual interest of 3.5%, compounded quarterly. he leaves the money in the account for 5 years. (a) calculate the amount of money he has in the account after 5 years. [3] (b) write down the amount of interest he earned after 5 years. [1] (c) karl decides to donate this interest to a charity in france. the charity receives 170 euros (eur). the exchange rate is 1 usd = t eur. calculate the value of t . [2] "},{"id":"c3p1q4","ch":2,"paper":"Logarithmics Test 2021–2022","section":"","num":4,"marks":5,"est":false,"html":"<p class=\"p\">Solve the equation $\\log_3(x+4) = 2 - \\log_3(x-4)$. <span class=\"mk\">[5]<\/span><\/p>","text":" solve the equation log_3(x+4) = 2 - log_3(x-4) . [5] "},{"id":"c3p1q5","ch":2,"paper":"Logarithmics Test 2021–2022","section":"","num":5,"marks":7,"est":false,"html":"<p class=\"p\">Let $f(x) = \\log_3 \\tfrac{x}{2} + \\log_3 16 - \\log_3 4$ for $x &gt; 0$.<\/p>\n<p class=\"p part\">(a) Show that $f(x) = \\log_3 2x$. <span class=\"mk\">[2]<\/span><\/p>\n<p class=\"p part\">(b) Find the value of $f(0.5)$ and $f(4.5)$. <span class=\"mk\">[3]<\/span><\/p>\n<p class=\"p\">The function $f$ can also be written in the form $f(x) = \\dfrac{\\ln ax}{\\ln b}$.<\/p>\n<p class=\"p part\">(c) Write down the value of $a$ and $b$. <span class=\"mk\">[2]<\/span><\/p>","text":" let f(x) = log_3 tfrac x 2 + log_3 16 - log_3 4 for x > 0 . (a) show that f(x) = log_3 2x . [2] (b) find the value of f(0.5) and f(4.5) . [3] the function f can also be written in the form f(x) = dfrac ln ax ln b . (c) write down the value of a and b . [2] "},{"id":"c3p1q6","ch":2,"paper":"Logarithmics Test 2021–2022","section":"","num":6,"marks":6,"est":false,"html":"<p class=\"p\">An arithmetic sequence has the first term $\\ln a$ and a common difference of $\\ln 3$. The 13th term in the sequence is $8 \\ln 9$. Find the value of $a$. <span class=\"mk\">[6]<\/span><\/p>","text":" an arithmetic sequence has the first term ln a and a common difference of ln 3 . the 13th term in the sequence is 8 ln 9 . find the value of a . [6] "},{"id":"c3p1q7","ch":2,"paper":"Logarithmics Test 2021–2022","section":"","num":7,"marks":5,"est":false,"html":"<p class=\"p\">Solve the equation $2 \\ln x = \\ln 9 + 4$. Give your answer in the form $x = pe^q$, where $p, q \\in \\mathbb{Z}^+$. <span class=\"mk\">[5]<\/span><\/p>","text":" solve the equation 2 ln x = ln 9 + 4 . give your answer in the form x = pe^q , where p, q in mathbb z ^+ . [5] "},{"id":"c3p1q8","ch":2,"paper":"Logarithmics Test 2021–2022","section":"","num":8,"marks":11,"est":false,"html":"<p class=\"p\">Let $f(x) = \\ln\\!\\left(\\dfrac{a^{2x^2}}{a^{7+3x}}\\right)$ where $a &gt; 0$, $a \\ne 1$.<\/p>\n<p class=\"p part\">(a) Show that $f(x) = 2x^2 \\ln a - 7 \\ln a - 3x \\ln a$. <span class=\"mk\">[4]<\/span><\/p>\n<p class=\"p part\">(b) Hence, determine the exact values of the $x$-intercepts. <span class=\"mk\">[4]<\/span><\/p>\n<p class=\"p part\">(c) Given that $f(-1) = 1$, determine the exact value of $a$. <span class=\"mk\">[3]<\/span><\/p>","text":" let f(x) = ln ! left( dfrac a^ 2x^2 a^ 7+3x right) where a > 0 , a ne 1 . (a) show that f(x) = 2x^2 ln a - 7 ln a - 3x ln a . [4] (b) hence, determine the exact values of the x -intercepts. [4] (c) given that f(-1) = 1 , determine the exact value of a . [3] "},{"id":"c3p1q9","ch":2,"paper":"Logarithmics Test 2021–2022","section":"","num":9,"marks":12,"est":false,"html":"<p class=\"p\">Consider the function $f(x) = \\dfrac{\\ln x}{x}$.<\/p>\n<p class=\"p part\">(a) Sketch the graph of $f$, labelling clearly the asymptote, the $x$-intercept and the maximum point. <span class=\"mk\">[3]<\/span><\/p>\n<p class=\"p part\">(b) Write down the domain and range of $f(x)$. <span class=\"mk\">[2]<\/span><\/p>\n<p class=\"p part\">(c) The line $y = k$ intersects $f(x)$ at only one point. Determine the possible values of $k$. <span class=\"mk\">[3]<\/span><\/p>\n<p class=\"p\">Now let $g(x) = \\dfrac{\\ln(-x)}{x}$ and $h(x) = \\dfrac{-\\ln(-x)}{x}$.<\/p>\n<p class=\"p part\">(d) Determine a single transformation that maps $f(x)$ to $h(x)$. <span class=\"mk\">[2]<\/span><\/p>\n<p class=\"p part\">(e) Find the values of $x$ such that $h(x) &gt; g(x)$. <span class=\"mk\">[2]<\/span><\/p>","text":" consider the function f(x) = dfrac ln x x . (a) sketch the graph of f , labelling clearly the asymptote, the x -intercept and the maximum point. [3] (b) write down the domain and range of f(x) . [2] (c) the line y = k intersects f(x) at only one point. determine the possible values of k . [3] now let g(x) = dfrac ln(-x) x and h(x) = dfrac - ln(-x) x . (d) determine a single transformation that maps f(x) to h(x) . [2] (e) find the values of x such that h(x) > g(x) . [2] "},{"id":"c3p2q1","ch":2,"paper":"Logarithmics Test 2022–2023","section":"","num":1,"marks":4,"est":false,"html":"<p class=\"p\">Solve $9^{4x-1} = 27^{x-3}$. Express your answer in the form $\\dfrac{p}{q}$ where $p, q \\in \\mathbb{Z}$. <span class=\"mk\">[4]<\/span><\/p>","text":" solve 9^ 4x-1 = 27^ x-3 . express your answer in the form dfrac p q where p, q in mathbb z . [4] "},{"id":"c3p2q2","ch":2,"paper":"Logarithmics Test 2022–2023","section":"","num":2,"marks":4,"est":false,"html":"<p class=\"p\">Solve $3(5^x) = 48$. Leave your answer in exact value using only common logarithms. <span class=\"mk\">[4]<\/span><\/p>","text":" solve 3(5^x) = 48 . leave your answer in exact value using only common logarithms. [4] "},{"id":"c3p2q3","ch":2,"paper":"Logarithmics Test 2022–2023","section":"","num":3,"marks":6,"est":false,"html":"<p class=\"p\">Let $a = \\log x$, $b = \\log y$ and $c = \\log z$. Write $\\log\\!\\left(\\dfrac{x^2\\sqrt{y}}{z^3}\\right)$ in terms of $a$, $b$ and $c$. <span class=\"mk\">[6]<\/span><\/p>","text":" let a = log x , b = log y and c = log z . write log ! left( dfrac x^2 sqrt y z^3 right) in terms of a , b and c . [6] "},{"id":"c3p2q4","ch":2,"paper":"Logarithmics Test 2022–2023","section":"","num":4,"marks":7,"est":false,"html":"<p class=\"p\">The number of bacteria, $N$, can be modelled by the equation $N = N_0 e^{kt}$ where $N_0$ is the initial number and $t$ is measured in minutes. After 15 minutes it is found that $\\dfrac{N}{N_0} = 1.3$.<\/p>\n<p class=\"p part\">(a) Find the value of $k$. <span class=\"mk\">[3]<\/span><\/p>\n<p class=\"p part\">(b) Find the least whole number of minutes for which $\\dfrac{N}{N_0} &gt; 2.5$. <span class=\"mk\">[4]<\/span><\/p>","text":" the number of bacteria, n , can be modelled by the equation n = n_0 e^ kt where n_0 is the initial number and t is measured in minutes. after 15 minutes it is found that dfrac n n_0 = 1.3 . (a) find the value of k . [3] (b) find the least whole number of minutes for which dfrac n n_0 > 2.5 . [4] "},{"id":"c3p2q5","ch":2,"paper":"Logarithmics Test 2022–2023","section":"","num":5,"marks":5,"est":false,"html":"<p class=\"p\">Sketch the graph of $f(x) = \\ln\\!\\big((x-2)^2\\big) + 1$, being sure to include any axes intercepts and the equations of any asymptotes. <span class=\"mk\">[5]<\/span><\/p>","text":" sketch the graph of f(x) = ln ! big((x-2)^2 big) + 1 , being sure to include any axes intercepts and the equations of any asymptotes. [5] "},{"id":"c3p2q6","ch":2,"paper":"Logarithmics Test 2022–2023","section":"","num":6,"marks":5,"est":false,"html":"<p class=\"p\">Solve $\\log_{2x} 32 = 3$. Leave your answer in the form $\\sqrt[3]{a}$ where $a \\in \\mathbb{N}$. <span class=\"mk\">[5]<\/span><\/p>","text":" solve log_ 2x 32 = 3 . leave your answer in the form sqrt[3] a where a in mathbb n . [5] "},{"id":"c3p2q7","ch":2,"paper":"Logarithmics Test 2022–2023","section":"","num":7,"marks":5,"est":false,"html":"<p class=\"p\">A population increases by 23 percent per day. Find the time it takes for the population to reach 8 times the original amount, leaving your answer in the form $\\dfrac{a \\ln b}{\\ln c - d \\ln e}$ where $a, b, c, d, e \\in \\mathbb{Z}$. <span class=\"mk\">[5]<\/span><\/p>","text":" a population increases by 23 percent per day. find the time it takes for the population to reach 8 times the original amount, leaving your answer in the form dfrac a ln b ln c - d ln e where a, b, c, d, e in mathbb z . [5] "},{"id":"c3p2q8","ch":2,"paper":"Logarithmics Test 2022–2023","section":"","num":8,"marks":5,"est":false,"html":"<p class=\"p\">Solve the equation $\\tfrac{1}{2}\\log_2 x - \\log_{32} x = 4$. Express your answer in the form $a^b$ where $a, b \\in \\mathbb{Q}$. <span class=\"mk\">[5]<\/span><\/p>","text":" solve the equation tfrac 1 2 log_2 x - log_ 32 x = 4 . express your answer in the form a^b where a, b in mathbb q . [5] "},{"id":"c3p2q9","ch":2,"paper":"Logarithmics Test 2022–2023","section":"","num":9,"marks":8,"est":false,"html":"<p class=\"p\">The function $f$ is defined for $x &gt; 3$ by $f(x) = 2\\ln x + \\ln(x-2) - \\ln(x^3 - 5x^2 + 6x)$. Find $f^{-1}(x)$. <span class=\"mk\">[8]<\/span><\/p>","text":" the function f is defined for x > 3 by f(x) = 2 ln x + ln(x-2) - ln(x^3 - 5x^2 + 6x) . find f^ -1 (x) . [8] "},{"id":"c3p2q10","ch":2,"paper":"Logarithmics Test 2022–2023","section":"","num":10,"marks":15,"est":false,"html":"<p class=\"p\">Consider the function $f(x) = a^x$ where $x, a \\in \\mathbb{R}$ and $x &gt; 0$, $a &gt; 1$. The graph of $f$ contains the point $\\left(\\tfrac{2}{3}, 4\\right)$.<\/p>\n<p class=\"p part\">(a) Show that $a = 8$. <span class=\"mk\">[2]<\/span><\/p>\n<p class=\"p part\">(b) Find an expression for $f^{-1}(x)$. <span class=\"mk\">[1]<\/span><\/p>\n<p class=\"p part\">(c) Find the value of $f^{-1}(\\sqrt{32})$. <span class=\"mk\">[3]<\/span><\/p>\n<p class=\"p\">Consider the arithmetic sequence $\\log_8 27$, $\\log_8 p$, $\\log_8 q$, and $\\log_8 125$, where $p, q &gt; 1$.<\/p>\n<p class=\"p part\">(d) Show that $27$, $p$, $q$ and $125$ are consecutive terms in a geometric sequence. <span class=\"mk\">[4]<\/span><\/p>\n<p class=\"p part\">(e) Find the value of $p$ and the value of $q$. <span class=\"mk\">[5]<\/span><\/p>","text":" consider the function f(x) = a^x where x, a in mathbb r and x > 0 , a > 1 . the graph of f contains the point left( tfrac 2 3 , 4 right) . (a) show that a = 8 . [2] (b) find an expression for f^ -1 (x) . [1] (c) find the value of f^ -1 ( sqrt 32 ) . [3] consider the arithmetic sequence log_8 27 , log_8 p , log_8 q , and log_8 125 , where p, q > 1 . (d) show that 27 , p , q and 125 are consecutive terms in a geometric sequence. [4] (e) find the value of p and the value of q . [5] "},{"id":"c3p3q1","ch":2,"paper":"Logarithmics Test 2023–2024","section":"","num":1,"marks":12,"est":true,"html":"<p class=\"p\">Let $a = \\log 5$ and $b = \\log 7$.<\/p>\n<p class=\"p part\">(a) Find the following in terms of $a$ and/or $b$:<\/p>\n<p class=\"p sub\">i. $\\log 175$<span class=\"gap\"><\/span>ii. $\\log 500$<\/p>\n<p class=\"p part\">(b) Write the following as a single logarithm:<\/p>\n<p class=\"p sub\">i. $a + b$<span class=\"gap\"><\/span>ii. $2b - a$<\/p>","text":" let a = log 5 and b = log 7 . (a) find the following in terms of a and/or b : i. log 175 ii. log 500 (b) write the following as a single logarithm: i. a + b ii. 2b - a "},{"id":"c3p3q2","ch":2,"paper":"Logarithmics Test 2023–2024","section":"","num":2,"marks":6,"est":true,"html":"<p class=\"p\">Given that $2^m = 8$ and $2^n = 32$:<\/p>\n<p class=\"p part\">(a) Write down the value of $m$ and $n$.<\/p>\n<p class=\"p part\">(b) Hence or otherwise solve $8^{2x+1} = 32^{2x-3}$.<\/p>","text":" given that 2^m = 8 and 2^n = 32 : (a) write down the value of m and n . (b) hence or otherwise solve 8^ 2x+1 = 32^ 2x-3 . "},{"id":"c3p3q3","ch":2,"paper":"Logarithmics Test 2023–2024","section":"","num":3,"marks":9,"est":true,"html":"<p class=\"p\">Let $f(x) = (\\ln x)^2 - \\ln x$. The diagram below shows the graph of $y = f(x)$.<\/p>\n<figure id=\"fig-c3_2324_q3\"><div class=\"fig-row\"><div class=\"fig-cell\"><div class=\"fig-svg\"><svg xmlns=\"http://www.w3.org/ .4 L276.9,264.5 L277.1,264.6 L277.3,264.6 L277.5,264.7 L277.8,264.7 L278.0,264.8\"/><text class=\"lb\" x=\"204.7\" y=\"185.2\" text-anchor=\"start\">y = f(x)<\/text><text class=\"lb\" x=\"149.7\" y=\"258.5\" text-anchor=\"start\">y = f⁻¹(x)<\/text><\/svg><\/div><span class=\"fig-tag\">Redrawn<\/span><\/div><\/div><figcaption>Redrawn exactly. y = f(x) solid, y = f⁻¹(x) dashed, asymptotes x = 1 and y = 1, bounded region shaded.<\/figcaption><\/figure>\n<p class=\"p part\">(a) Determine the function $f^{-1}(x)$. <span class=\"mk\">[2]<\/span><\/p>\n<p class=\"p part\">(b) Describe a transformation that maps the graph of $y = f(x)$ onto the graph of $y = f^{-1}(x)$. <span class=\"mk\">[1]<\/span><\/p>\n<p class=\"p part\">(c) Write down the equation of the asymptote of<span class=\"gap\"><\/span>i. $y = f(x)$ <span class=\"mk\">[1]<\/span><span class=\"gap\"><\/span>ii. $y = f^{-1}(x)$ <span class=\"mk\">[1]<\/span><\/p>\n<p class=\"p part\">(d) Find the coordinates of the point of intersection of the two graphs. <span class=\"mk\">[2]<\/span><\/p>\n<p class=\"p part\">(e) Find the $x$-coordinate of the point of intersection between the graph of $y = f^{-1}(x)$ and the horizontal asymptote of the graph of $y = f(x)$. <span class=\"mk\">[2]<\/span><\/p>","text":" let f(x) = 1 + e^ 1-x . the diagram below shows the graphs of y = f(x) and y = f^ -1 (x) . the area completely bound by the two graphs and their asymptotes is shaded. figure (c3_2324_q8): redrawn exactly. y = f(x) solid, y = f⁻¹(x) dashed, asymptotes x = 1 and y = 1, bounded region shaded. (a) determine the function f^ -1 (x) . [2] (b) describe a transformation that maps the graph of y = f(x) onto the graph of y = f^ -1 (x) . [1] (c) write down the equation of the asymptote of i. y = f(x) [1] ii. y = f^ -1 (x) [1] (d) find the coordinates of the point of intersection of the two graphs. [2] (e) find the x -coordinate of the point of intersection between the graph of y = f^ -1 (x) and the horizontal asymptote of the graph of y = f(x) . [2] "},{"id":"c3p3q9","ch":2,"paper":"Logarithmics Test 2023–2024","section":"","num":9,"marks":13,"est":false,"html":"<p class=\"p\">The length of time, $T$, a mobile phone battery lasts in hours depends on the number of times, $n$, that it has been charged and is determined by the equation $T = 20e^{-0.003n} + 8$.<\/p>\n<p class=\"p part\">(a) Write down the number of hours a battery in a new phone lasts. <span class=\"mk\">[1]<\/span><\/p>\n<p class=\"p part\">(b) For this function<\/p>\n<p class=\"p sub\">i. write down the equation of the asymptote; <span class=\"mk\">[1]<\/span><\/p>\n<p class=\"p sub\">ii. sketch the graph of the function for $0 \\le n \\le 1000$, clearly showing the axis intercept and asymptote. <span class=\"mk\">[2]<\/span><\/p>\n<p class=\"p\">A certain fully charged phone lasts for at least 20 hours.<\/p>\n<p class=\"p part\">(c) Find the maximum number of times it has been recharged. <span class=\"mk\">[3]<\/span><\/p>\n<p class=\"p\">It takes 2 hours to charge the phone. Let $A$ be the minimum possible age of the phone in hours.<\/p>\n<p class=\"p part\">(d) Show that after the phone has been used and recharged $n$ times then $A = \\dfrac{20(1 - e^{-0.003n})}{1 - e^{-0.003}} + 10n$. <span class=\"mk\">[3]<\/span><\/p>\n<p class=\"p\">Paul inherits a phone from his brother. The phone is fully charged. The first time he uses it he notices that the battery lasts less than 20 hours.<\/p>\n<p class=\"p part\">(e) Find the minimum age of the phone when Paul receives it. Write your answer to the nearest day. <span class=\"mk\">[3]<\/span><\/p>","text":" the length of time, t , a mobile phone battery lasts in hours depends on the number of times, n , that it has been charged and is determined by the equation t = 20e^ -0.003n + 8 . (a) write down the number of hours a battery in a new phone lasts. [1] (b) for this function i. write down the equation of the asymptote; [1] ii. sketch the graph of the function for 0 le n le 1000 , clearly showing the axis intercept and asymptote. [2] a certain fully charged phone lasts for at least 20 hours. (c) find the maximum number of times it has been recharged. [3] it takes 2 hours to charge the phone. let a be the minimum possible age of the phone in hours. (d) show that after the phone has been used and recharged n times then a = dfrac 20(1 - e^ -0.003n ) 1 - e^ -0.003 + 10n . [3] paul inherits a phone from his brother. the phone is fully charged. the first time he uses it he notices that the battery lasts less than 20 hours. (e) find the minimum age of the phone when paul receives it. write your answer to the nearest day. [3] "},{"id":"c4p1q1","ch":3,"paper":"Trigonometry Test 2020–2021","section":"","num":1,"marks":6,"est":false,"html":"<p class=\"p\">The following diagram shows a circle with centre $O$ and radius $r$.<\/p>\n<figure id=\"fig-t_2021_q1\"><div class=\"fig-row\"><div class=\"fig-cell\"><div class=\"fig-svg\"><svg xmlns=\"http://www.w3.org/2000/svg\" class=\"dg\" viewBox=\"0 0 240 210\" width=\"240\" role=\"img\"><style>.gr{stroke:var(--grid,#c9d1d8);stroke-width:.7;stroke-dasharray:2 2}.ax{stroke:var(--fg,#1d2329);stroke-width:1.2}.ahd{fill:var(--fg,#1d2329)}.c1{fill:none;stroke:var(--accent,#1f6f78);stroke-width:2;stroke-linejoin:round}.c2{fill:none;stroke:var(--accent2,#b5562a);stroke-width:2;stroke-dasharray:6 4}.as{stroke:var(--muted,#5f6b76);stroke-width:1;stroke-dasharray:4 4}.sh{fill:var(--accent-soft,#e3f0f1);stroke:none}.dt{fill:var(--accent,#1f6f78)}.dto{fill:var(--paper,#fff);stroke:var(--accent2,#b5562a);stroke-width:1.5}.lb{fill:var(--fg,#1d2329);font:13px system-ui,sans-serif}.it{font-style:italic;font-family:Georgia,serif}.tk{fill:var(--muted,#5f6b76);font:11px ui-monospace,monospace}<\/style><defs><marker id=\"ah\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0L8,4L0,8z\" class=\"ahd\"/><\/marker><\/defs><path class=\"sh\" d=\"M120,110 L200.0,110.0 A80  sqrt 5 3 , where theta is acute. (a) find cos theta . [3] (b) find cos 2 theta . [2] "},{"id":"c4p1q3","ch":3,"paper":"Trigonometry Test 2020–2021","section":"","num":3,"marks":6,"est":false,"html":"<p class=\"p part\">(a) Show that the equation $2\\cos^2 x + 5\\sin x = 4$ may be written in the form $2\\sin^2 x - 5\\sin x + 2 = 0$. <span class=\"mk\">[1]<\/span><\/p>\n<p class=\"p part\">(b) Hence, solve the equation $2\\cos^2 x + 5\\sin x = 4$, where $0 \\le x \\le 2\\pi$. <span class=\"mk\">[5]<\/span><\/p>","text":" (a) show that the equation 2 cos^2 x + 5 sin x = 4 may be written in the form 2 sin^2 x - 5 sin x + 2 = 0 . [1] (b) hence, solve the equation 2 cos^2 x + 5 sin x = 4 , where 0 le x le 2 pi . [5] "},{"id":"c4p1q4","ch":3,"paper":"Trigonometry Test 2020–2021","section":"","num":4,"marks":6,"est":false,"html":"<p class=\"p\">Consider $g(x) = 3\\sin 2x$.<\/p>\n<p class=\"p part\">(a) Write down the period of $g$. <span class=\"mk\">[1]<\/span><\/p>\n<p class=\"p part\">(b) Sketch the curve of $g$ for $0 \\le x \\le 2\\pi$. <span class=\"mk\">[3]<\/span><\/p>\n<p class=\"p part\">(c) Write down the number of solutions to the equation $g(x) = 2$, for $0 \\le x \\le 2\\pi$. <span class=\"mk\">[2]<\/span><\/p>","text":" consider g(x) = 3 sin 2x . (a) write down the period of g . [1] (b) sketch the curve of g for 0 le x le 2 pi . [3] (c) write down the number of solutions to the equation g(x) = 2 , for 0 le x le 2 pi . [2] "},{"id":"c4p1q5","ch":3,"paper":"Trigonometry Test 2020–2021","section":"","num":5,"marks":5,"est":false,"html":"<p class=\"p\">Prove $\\dfrac{1 + \\sin x}{1 - \\sin x} = 2\\sec^2 x + 2\\sec x \\tan x - 1$. <span class=\"mk\">[5]<\/span><\/p>","text":" prove dfrac 1 + sin x 1 - sin x = 2 sec^2 x + 2 sec x tan x - 1 . [5] "},{"id":"c4p1q6","ch":3,"paper":"Trigonometry Test 2020–2021","section":"","num":6,"marks":7,"est":false,"html":"<p class=\"p\">The following diagram shows triangle $ABC$, with $AB = 10$, $BC = x$ and $AC = 2x$.<\/p>\n<figure id=\"fig-t_2021_q6\"><div class=\"fig-row\"><div class=\"fig-cell\"><div class=\"fig-svg\"><svg xmlns=\"http://www.w3.org/2000/svg\" class=\"dg\" viewBox=\"0 0 240 176\" width=\"240\" role=\"img\"><style>.gr{stroke:var(--grid,#c9d1d8);stroke-width:.7;stroke-dasharray:2 2}.ax{stroke:var(--fg,#1d2329);stroke-width:1.2}.ahd{fill:var(--fg,#1d2329)}.c1{fill:none;stroke:var(--accent,#1f6f78);stroke-width:2;stroke-linejoin:round}.c2{fill:none;stroke:var(--accent2,#b5562a);stroke-width:2;stroke-dasharray:6 4}.as{stroke:var(--muted,#5f6b76);stroke-width:1;stroke-dasharray:4 4}.sh{fill:var(--accent-soft,#e3f0f1);stroke:none}.dt{fill:var(--accent,#1f6f78)}.dto{fill:var(--paper,#fff);stroke:var(--accent2,#b5562a);stroke-width:1.5}.lb{fill:var(--fg,#1d2329);font:13px system-ui,sans-serif}.it{font-style:italic;font-family:Georgia,serif}.tk{fill:var(--muted,#5f6b76);font:11px ui-monospace,monospace}<\/style><defs><marker id=\"ah\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0L8,4L0,8z\" class=\"ahd\"/><\/marker><\/defs><path class=\"c1\" d=\"M30.0,40.0 L190.0,40.0 L230.0,145.8 Z\"/><text class=\"lb\" x=\"20.0\" y=\"40.0\" text-anchor=\"middle\">A<\/text><text class=\"lb\" x=\"200.0\" y=\"40.0\" text-anchor=\"middle\">B<\/text><text class=\"lb\" x=\"230.0\" y=\"161.8\" text-anchor=\"middle\">C<\/text><text class=\"lb it\" x=\"110.0\" y=\"34.0\" text-anchor=\"middle\">10<\/text><text class=\"lb it\" x=\"220.0\" y=\"92.9\" text-anchor=\"middle\">x<\/text><text class=\"lb it\" x=\"116.0\" y=\"96.9\" text-anchor=\"middle\">2x<\/text><\/svg><\/div><span class=\"fig-tag\">Redrawn<\/span><\/div><\/div><figcaption>Redrawn to the question's data: AB = 10, BC = x, AC = 2x.<\/figcaption><\/figure>\n<p class=\"p\">Given that $\\cos C = \\tfrac{3}{4}$, find the area of the triangle. Give your answer in the form $\\dfrac{p\\sqrt{q}}{2}$, where $p, q \\in \\mathbb{Z}^+$. <span class=\"mk\">[7]<\/span><\/p>","text":" the following diagram shows triangle abc , with ab = 10 , bc = x and ac = 2x . figure (t_2021_q6): redrawn to the question's data: ab = 10, bc = x, ac = 2x. given that cos c = tfrac 3 4 , find the area of the triangle. give your answer in the form dfrac p sqrt q 2 , where p, q in mathbb z ^+ . [7] "},{"id":"c4p1q7","ch":3,"paper":"Trigonometry Test 2020–2021","section":"","num":7,"marks":10,"est":false,"html":"<p class=\"p\">Let $f(x) = 6x\\sqrt{1 - x^2}$, for $-1 \\le x \\le 1$, and $g(x) = \\cos x$, for $0 \\le x \\le \\pi$. Let $h(x) = (f \\circ g)(x)$.<\/p>\n<p class=\"p part\">(a) Write $h(x)$ in the form $a\\sin(bx)$ where $a, b \\in \\mathbb{Z}$. <span class=\"mk\">[5]<\/span><\/p>\n<p class=\"p part\">(b) Hence find the range of $h$. <span class=\"mk\">[2]<\/span><\/p>\n<p class=\"p part\">(c) Suppose $h(x)$ is given a translation of $\\tfrac{\\pi}{3}$ to the right, and $\\pi$ downwards to create a new function $z(x)$. Find an equation for $z(x)$ and state its new range. <span class=\"mk\">[3]<\/span><\/p>","text":" let f(x) = 6x sqrt 1 - x^2 , for -1 le x le 1 , and g(x) = cos x , for 0 le x le pi . let h(x) = (f circ g)(x) . (a) write h(x) in the form a sin(bx) where a, b in mathbb z . [5] (b) hence find the range of h . [2] (c) suppose h(x) is given a translation of tfrac pi 3 to the right, and pi downwards to create a new function z(x) . find an equation for z(x) and state its new range. [3] "},{"id":"c4p1q8","ch":3,"paper":"Trigonometry Test 2020–2021","section":"","num":8,"marks":8,"est":false,"html":"<p class=\"p part\">(a) Show that $\\log_9(\\cos 2x + 2) = \\log_3\\sqrt{\\cos 2x + 2}$. <span class=\"mk\">[3]<\/span><\/p>\n<p class=\"p part\">(b) Hence or otherwise, solve $\\log_3(2\\sin x) = \\log_9(\\cos 2x + 2)$ for $0 &lt; x &lt; \\tfrac{\\pi}{2}$. <span class=\"mk\">[5]<\/span><\/p>","text":" (a) show that log_9( cos 2x + 2) = log_3 sqrt cos 2x + 2 . [3] (b) hence or otherwise, solve log_3(2 sin x) = log_9( cos 2x + 2) for 0 < x < tfrac pi 2 . [5] "},{"id":"c4p1q9","ch":3,"paper":"Trigonometry Test 2020–2021","section":"","num":9,"marks":13,"est":false,"html":"<p class=\"p\">Consider $f(x) = \\sqrt{x}\\sin\\!\\left(\\tfrac{\\pi}{4}x\\right)$ and $g(x) = \\sqrt{x}$ for $x \\ge 0$. The first time the graphs of $f$ and $g$ intersect is at $x = 0$. The set of all non-zero values that satisfy $f(x) = g(x)$ can be described as an arithmetic sequence, $u_n = a + bn$ where $n \\ge 1$.<\/p>\n<p class=\"p part\">(a) Find the two smallest non-zero values of $x$ for which $f(x) = g(x)$. <span class=\"mk\">[5]<\/span><\/p>\n<p class=\"p part\">(b) Find the value of $a$ and $b$. <span class=\"mk\">[4]<\/span><\/p>\n<p class=\"p part\">(c) At point $P$, the graph of $f$ and $g$ intersect for the 21st time. Find the coordinates of $P$. <span class=\"mk\">[4]<\/span><\/p>","text":" consider f(x) = sqrt x sin ! left( tfrac pi 4 x right) and g(x) = sqrt x for x ge 0 . the first time the graphs of f and g intersect is at x = 0 . the set of all non-zero values that satisfy f(x) = g(x) can be described as an arithmetic sequence, u_n = a + bn where n ge 1 . (a) find the two smallest non-zero values of x for which f(x) = g(x) . [5] (b) find the value of a and b . [4] (c) at point p , the graph of f and g intersect for the 21st time. find the coordinates of p . [4] "},{"id":"c4p2q1","ch":3,"paper":"Trigonometry Test 2022–2023","section":"","num":1,"marks":6,"est":false,"html":"<p class=\"p\">Determine the following values exactly.<\/p>\n<p class=\"p part\">(a) $\\cos\\!\\left(\\tfrac{5\\pi}{2}\\right)$ <span class=\"mk\">[2]<\/span><span class=\"gap\"><\/span>(b) $\\sin\\!\\left(\\tfrac{5\\pi}{4}\\right)$ <span class=\"mk\">[2]<\/span><span class=\"gap\"><\/span>(c) $\\tan\\!\\left(-\\tfrac{\\pi}{3}\\right)$ <span class=\"mk\">[2]<\/span><\/p>","text":" determine the following values exactly. (a) cos ! left( tfrac 5 pi 2 right) [2] (b) sin ! left( tfrac 5 pi 4 right) [2] (c) tan ! left(- tfrac pi 3 right) [2] "},{"id":"c4p2q2","ch":3,"paper":"Trigonometry Test 2022–2023","section":"","num":2,"marks":8,"est":false,"html":"<p class=\"p\">Let $\\sin x = \\tfrac{1}{7}$ and $\\tfrac{\\pi}{2} &lt; x &lt; \\pi$. Find the value of the following exactly, in simplest radical form.<\/p>\n<p class=\"p part\">(a) $\\cos x$ <span class=\"mk\">[3]<\/span><span class=\"gap\"><\/span>(b) $\\tan x$ <span class=\"mk\">[2]<\/span><span class=\"gap\"><\/span>(c) $\\sin 2x$ <span class=\"mk\">[3]<\/span><\/p>","text":" let sin x = tfrac 1 7 and tfrac pi 2 < x < pi . find the value of the following exactly, in simplest radical form. (a) cos x [3] (b) tan x [2] (c) sin 2x [3] "},{"id":"c4p2q3","ch":3,"paper":"Trigonometry Test 2022–2023","section":"","num":3,"marks":5,"est":false,"html":"<p class=\"p\">Solve the equation $2\\sin^2 x - 9\\sin x + 4 = 0$ for $0 \\le x \\le 2\\pi$. <span class=\"mk\">[5]<\/span><\/p>","text":" solve the equation 2 sin^2 x - 9 sin x + 4 = 0 for 0 le x le 2 pi . [5] "},{"id":"c4p2q4","ch":3,"paper":"Trigonometry Test 2022–2023","section":"","num":4,"marks":4,"est":false,"html":"<p class=\"p\">Given that $\\sin p = \\tfrac{2}{3}$ and $\\cos q = -\\tfrac{1}{4}$, with $p$ and $q$ both in the interval $\\left(\\tfrac{\\pi}{2}, \\pi\\right)$, find $\\cos(p - q)$. Answer in the form $\\dfrac{\\sqrt{a} + b\\sqrt{c}}{d}$. <span class=\"mk\">[4]<\/span><\/p>","text":" given that sin p = tfrac 2 3 and cos q = - tfrac 1 4 , with p and q both in the interval left( tfrac pi 2 , pi right) , find cos(p - q) . answer in the form dfrac sqrt a + b sqrt c d . [4] "},{"id":"c4p2q5","ch":3,"paper":"Trigonometry Test 2022–2023","section":"","num":5,"marks":5,"est":false,"html":"<p class=\"p\">The volume of water, $V$, in millions of gallons, stored in a reservoir during any month is predicted by using the formula $V = 1 + 0.5\\cos\\!\\left(\\tfrac{\\pi}{6}t\\right)$, where $t$ is the number of the month. (For January $t = 1$, February $t = 2$, …)<\/p>\n<p class=\"p part\">(a) Find the volume of water in the reservoir in October 2023. <span class=\"mk\">[2]<\/span><\/p>\n<p class=\"p part\">(b) Water restrictions begin when the volume of water stored is less than 0.55 million gallons. What months fall under water restrictions in 2023? <span class=\"mk\">[2]<\/span><\/p>\n<p class=\"p part\">(c) In what month is the water in the reservoir at the lowest point? <span class=\"mk\">[1]<\/span><\/p>","text":" the volume of water, v , in millions of gallons, stored in a reservoir during any month is predicted by using the formula v = 1 + 0.5 cos ! left( tfrac pi 6 t right) , where t is the number of the month. (for january t = 1 , february t = 2 , …) (a) find the volume of water in the reservoir in october 2023. [2] (b) water restrictions begin when the volume of water stored is less than 0.55 million gallons. what months fall under water restrictions in 2023? [2] (c) in what month is the water in the reservoir at the lowest point? [1] "},{"id":"c4p2q6","ch":3,"paper":"Trigonometry Test 2022–2023","section":"","num":6,"marks":5,"est":false,"html":"<p class=\"p\">Part of the graph of $f(x) = a\\sin(x + c)$ for $a &gt; 0$ and lowest value of $c$ is shown in the diagram.<\/p>\n<figure id=\"fig-t_2223_q6\"><div class=\"fig-row\"><div class=\"fig-cell\"><div class=\"fig-svg\"><svg xmlns=\"http://www.w3.org/2000/svg\" class=\"dg\" viewBox=\"0 0 360 243\" width=\"360\" role=\"img\"><style>.gr{stroke:var(--grid,#c9d1d8);stroke-width:.7;stroke-dasharray:2 2}.ax{stroke:var(--fg,#1d2329);stroke-width:1.2}.ahd{fill:var(--fg,#1d2329)}.c1{fill:none;stroke:var(--accent,#1f6f78);stroke-width:2;stroke-linejoin:round}.c2{fill:none;stroke:var(--accent2,#b5562a);stroke-width:2;stroke-dasharray:6 4}.as{stroke:var(--muted,#5f6b76);stroke-width:1;stroke-dasharray:4 4}.sh{fill:var(--accent-soft,#e3f0f1);stroke:none}.dt{fill:var(--accent,#1f6f78)}.dto{fill:var(--paper,#fff);stroke:var(--accent2,#b5562a);stroke-width:1.5}.lb{fill:var(--fg,#1d2329);font:13px system-ui,sans-serif}.it{font-style:italic;font-family:Ge \" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0L8,4L0,8z\" class=\"ahd\"/><\/marker><\/defs><circle class=\"c1\" cx=\"130\" cy=\"95\" r=\"75\"/><line class=\"c1\" x1=\"55.0\" y1=\"95.0\" x2=\"205.0\" y2=\"95.0\"/><text class=\"lb\" x=\"130.0\" y=\"89.0\" text-anchor=\"middle\">100<\/text><line class=\"ax\" x1=\"20.0\" y1=\"170.0\" x2=\"240.0\" y2=\"170.0\"/><circle class=\"dt\" cx=\"130.0\" cy=\"170.0\" r=\"3\"/><text class=\"lb\" x=\"130.0\" y=\"186.0\" text-anchor=\"middle\">P<\/text><path class=\"c2\" d=\"M211.8,124.8 A87,87 0 0 0 211.8,65.2\"/><text class=\"tk\" x=\"231.0\" y=\"99.0\" text-anchor=\"start\">anticlockwise<\/text><\/svg><\/div><span class=\"fig-tag\">Redrawn<\/span><\/div><\/div><figcaption>Redrawn: wheel of diameter 100 m, P starts at the lowest point at ground level.<\/figcaption><\/figure>\n<p class=\"p\">Let $P$ be a point on the wheel. The wheel starts with $P$ at the lowest point, at ground level. The wheel rotates at a constant rate, in an anticlockwise direction. One revolution takes 20 minutes.<\/p>\n<p class=\"p part\">(a) Write down the height of $P$ above ground level after <span class=\"mk\">[2]<\/span><\/p>\n<p class=\"p sub\">i. 10 minutes;<span class=\"gap\"><\/span>ii. 15 minutes.<\/p>\n<p class=\"p\">Let $h(t)$ metres be the height of $P$ above ground level after $t$ minutes. Some values of $h(t)$ are given in the table below.<\/p>\n<table><thead><tr><th>$t$<\/th><th>0<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><\/tr><\/thead><tbody><tr><td>$h(t)$<\/td><td>0.0<\/td><td>2.4<\/td><td>9.5<\/td><td>20.6<\/td><td>34.5<\/td><td>50.0<\/td><\/tr><\/tbody><\/table>\n<p class=\"p part\">(b) Determine the values of: i. $h(8)$; ii. $h(21)$. <span class=\"mk\">[4]<\/span><\/p>\n<p class=\"p part\">(c) Sketch the graph of $h$, for $0 \\le t \\le 40$. <span class=\"mk\">[3]<\/span><\/p>\n<p class=\"p part\">(d) Given that $h$ can be expressed in the form $h(t) = a\\cos bt + c$, find $a$, $b$ and $c$. <span class=\"mk\">[5]<\/span><\/p>","text":" the following diagram represents a large ferris wheel, with a diameter of 100 metres. figure (t_2324_q8): redrawn: wheel of diameter 100 m, p starts at the lowest point at ground level. let p be a point on the wheel. the wheel starts with p at the lowest point, at ground level. the wheel rotates at a constant rate, in an anticlockwise direction. one revolution takes 20 minutes. (a) write down the height of p above ground level after [2] i. 10 minutes; ii. 15 minutes. let h(t) metres be the height of p above ground level after t minutes. some values of h(t) are given in the table below. | t | 0 | 1 | 2 | 3 | 4 | 5 | |---|---|---|---|---|---|---| | h(t) | 0.0 | 2.4 | 9.5 | 20.6 | 34.5 | 50.0 | (b) determine the values of: i. h(8) ; ii. h(21) . [4] (c) sketch the graph of h , for 0 le t le 40 . [3] (d) given that h can be expressed in the form h(t) = a cos bt + c , find a , b and c . [5] "},{"id":"c4p3q9","ch":3,"paper":"Trigonometry Test 2023–2024","section":"","num":9,"marks":14,"est":false,"html":"<p class=\"p\">Consider an acute angle $\\theta$ such that $\\cos\\theta = \\tfrac{2}{3}$.<\/p>\n<p class=\"p part\">(a) Find the value of $\\sin\\theta$. <span class=\"mk\">[2]<\/span><\/p>\n<p class=\"p part\">(b) Find the value of $\\sin 2\\theta$. <span class=\"mk\">[2]<\/span><\/p>\n<p class=\"p\">The following diagram shows triangle $ABC$ with $\\angle B = \\theta$, $\\angle A = 2\\theta$, $BC = a$ and $AC = b$.<\/p>\n<figure id=\"fig-t_2324_q9a\"><div class=\"fig-row\"><div class=\"fig-cell\"><div class=\"fig-svg\"><svg xmlns=\"http://www.w3.org/2000/svg\" class=\"dg\" viewBox=\"0 0 163 194\" width=\"163\" role=\"img\"><style>.gr{stroke:var(--grid,#c9d1d8);stroke-width:.7;stroke-dasharray:2 2}.ax{stroke:var(--fg,#1d2329);stroke-width:1.2}.ahd{fill:var(--fg,#1d2329)}.c1{fill:none;stroke:var(--accent,#1f6f78);stroke-width:2;stroke-linejoin:round}.c2{fill:none;stroke:var(--accent2,#b5562a);stroke-width:2;stroke-dashar
