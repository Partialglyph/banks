:"","num":5,"marks":11,"est":false,"html":"<p class=\"p\">A Ferris wheel has a radius of 9 m and a maximum height of 20 m. The wheel rotates once every two minutes.<\/p>\n<p class=\"p part\">(a) A rider gets in at the bottom of the ride. Sketch a graph to represent the height of a rider $h$, above the ground varies with time, $t$, for the first three minutes. <span class=\"mk\">[4]<\/span><\/p>\n<p class=\"p part\">(b) Write an equation for the graph that models this scenario. <span class=\"mk\">[3]<\/span><\/p>\n<p class=\"p part\">(c) Determine the rider's height after 90 seconds. <span class=\"mk\">[2]<\/span><\/p>\n<p class=\"p part\">(d) For how many seconds during each revolution is the rider's height above 11 m? <span class=\"mk\">[2]<\/span><\/p>","text":" a ferris wheel has a radius of 9 m and a maximum height of 20 m. the wheel rotates once every two minutes. (a) a rider gets in at the bottom of the ride. sketch a graph to represent the height of a rider h , above the ground varies with time, t , for the first three minutes. [4] (b) write an equation for the graph that models this scenario. [3] (c) determine the rider's height after 90 seconds. [2] (d) for how many seconds during each revolution is the rider's height above 11 m? [2] "},{"id":"c4p4q6","ch":3,"paper":"Trigonometry Test 2024–2025","section":"","num":6,"marks":4,"est":false,"html":"<p class=\"p\">The diagram below shows $\\triangle ABC$ with $AB = 10$ cm, $BC = 5$ cm and $\\angle ABC = 120^\\circ$. Find the exact values of<\/p>\n<figure id=\"fig-t_2425_q6\"><div class=\"fig-row\"><div class=\"fig-cell\"><div class=\"fig-svg\"><svg xmlns=\"http://www.w3.org/2000/svg\" class=\"dg\" viewBox=\"0 0 230 193\" width=\"230\" role=\"img\"><style>.gr{stroke:var(--grid,#c9d1d8);stroke-width:.7;stroke-dasharray:2 2}.ax{stroke:var(--fg,#1d2329);stroke-width:1.2}.ahd{fill:var(--fg,#1d2329)}.c1{fill:none;stroke:var(--accent,#1f6f78);stroke-width:2;stroke-linejoin:round}.c2{fill:none;stroke:var(--accent2,#b5562a);stroke-width:2;stroke-dasharray:6 4}.as{stroke:var(--muted,#5f6b76);stroke-width:1;stroke-dasharray:4 4}.sh{fill:var(--accent-soft,#e3f0f1);stroke:none}.dt{fill:var(--accent,#1f6f78)}.dto{fill:var(--paper,#fff);stroke:var(--accent2,#b5562a);stroke-width:1.5}.lb{fill:var(--fg,#1d2329);font:13px system-ui,sans-serif}.it{font-style:italic;font-family:Georgia,serif}.tk{fill:var(--muted,#5f6b76);font:11px ui-monospace,monospace}<\/style><defs><marker id=\"ah\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0L8,4L0,8z\" class=\"ahd\"/><\/marker><\/defs><path class=\"c1\" d=\"M30.0,168.6 L110.0,30.0 L190.0,30.0 Z\"/><text class=\"lb\" x=\"22.0\" y=\"178.6\" text-anchor=\"middle\">A<\/text><text class=\"lb\" x=\"106.0\" y=\"22.0\" text-anchor=\"middle\">B<\/text><text class=\"lb\" x=\"200.0\" y=\"34.0\" text-anchor=\"middle\">C<\/text><text class=\"lb\" x=\"44.0\" y=\"99.3\" text-anchor=\"middle\">10 cm<\/text><text class=\"lb\" x=\"150.0\" y=\"24.0\" text-anchor=\"middle\">5 cm<\/text><path class=\"c1\" d=\"M103.0,42.1 A14,14 0 0 0 124.0,30.0\"/><text class=\"lb\" x=\"136.0\" y=\"56.0\" text-anchor=\"middle\">120°<\/text><\/svg><\/div><span class=\"fig-tag\">Redrawn<\/span><\/div><\/div><figcaption>Redrawn to scale: AB = 10 cm, BC = 5 cm, ∠ABC = 120°.<\/figcaption><\/figure>\n<p class=\"p part\">(a) length $AC$ <span class=\"mk\">[2]<\/span><\/p>\n<p class=\"p part\">(b) the area of $\\triangle ABC$. <span class=\"mk\">[2]<\/span><\/p>","text":" the diagram below shows triangle abc with ab = 10 cm, bc = 5 cm and angle abc = 120^ circ . find the exact values of figure (t_2425_q6): redrawn to scale: ab = 10 cm, bc = 5 cm, ∠abc = 120°. (a) length ac [2] (b) the area of triangle abc . [2] "},{"id":"c4p4q7","ch":3,"paper":"Trigonometry Test 2024–2025","section":"","num":7,"marks":5,"est":false,"html":"<p class=\"p\">Prove: $\\dfrac{\\tan\\theta - \\sin\\theta}{\\sec\\theta} = \\dfrac{\\sin^3\\theta}{1 + \\cos\\theta}$. <span class=\"mk\">[5]<\/span><\/p>","text":" prove: dfrac tan theta - sin theta sec theta = dfrac sin^3 theta 1 + cos theta . [5] "},{"id":"c4p4q8","ch":3,"paper":"Trigonometry Test 2024–2025","section":"","num":8,"marks":13,"est":false,"html":"<p class=\"p\">The water temperature $T$, in degrees Celsius, of an aquarium follows a sinusoidal pattern $T(t) = 24 + 4\\sin\\!\\left(\\tfrac{\\pi}{6}t\\right)$, where $t$ is the number of hours after midnight.<\/p>\n<p class=\"p part\">(a) Show that the minimum and maximum temperatures of the aquarium are $20^\\circ$C and $28^\\circ$C respectively. <span class=\"mk\">[2]<\/span><\/p>\n<p class=\"p part\">(b) Determine the specific times in the first 24 hours when the temperature is at its maximum. <span class=\"mk\">[2]<\/span><\/p>\n<p class=\"p\">The population of plankton, $P$, growing in the aquarium is modelled by an exponential function of temperature $P(t) = 200 \\times 2^{\\frac{T(t) - 24}{2}}$. <em class=\"note\">(the denominator of the exponent is blurry on the scan; 2 is consistent with part (e)'s \"8 hours\")<\/em><\/p>\n<p class=\"p part\">(c) Evaluate $P(0)$. <span class=\"mk\">[2]<\/span><\/p>\n<p class=\"p part\">(d) Find the first two times, $t \\in (0, 24]$, at which $P(t) = 200$. <span class=\"mk\">[2]<\/span><\/p>\n<p class=\"p\">In order to introduce fish into the aquarium and keep them well fed, the plankton population must be at least 400 for a minimum of 8 hours per day.<\/p>\n<p class=\"p part\">(e) Solve the trigonometric inequality for $0 \\le t \\le 24$ to find all intervals during which $P(t) \\ge 400$. <span class=\"mk\">[4]<\/span><\/p>\n<p class=\"p part\">(f) State the total hours in a 24-hour period that the population is at least 400. <span class=\"mk\">[1]<\/span><\/p>","text":" the water temperature t , in degrees celsius, of an aquarium follows a sinusoidal pattern t(t) = 24 + 4 sin ! left( tfrac pi 6 t right) , where t is the number of hours after midnight. (a) show that the minimum and maximum temperatures of the aquarium are 20^ circ c and 28^ circ c respectively. [2] (b) determine the specific times in the first 24 hours when the temperature is at its maximum. [2] the population of plankton, p , growing in the aquarium is modelled by an exponential function of temperature p(t) = 200 times 2^ frac t(t) - 24 2 . (the denominator of the exponent is blurry on the scan; 2 is consistent with part (e)'s \"8 hours\") (c) evaluate p(0) . [2] (d) find the first two times, t in (0, 24] , at which p(t) = 200 . [2] in order to introduce fish into the aquarium and keep them well fed, the plankton population must be at least 400 for a minimum of 8 hours per day. (e) solve the trigonometric inequality for 0 le t le 24 to find all intervals during which p(t) ge 400 . [4] (f) state the total hours in a 24-hour period that the population is at least 400. [1] "},{"id":"c4p4q9","ch":3,"paper":"Trigonometry Test 2024–2025","section":"","num":9,"marks":12,"est":false,"html":"<p class=\"p part\">(a) Show that $(\\sin\\theta + \\cos\\theta)^2 = 1 + \\sin 2\\theta$. <span class=\"mk\">[3]<\/span><\/p>\n<p class=\"p part\">(b) Hence or otherwise, prove $(\\sin\\theta + \\cos\\theta)^4 + (\\sin\\theta - \\cos\\theta)^4 = 2 + 2\\sin^2 2\\theta$. <span class=\"mk\">[4]<\/span><\/p>\n<p class=\"p part\">(c) Hence, determine the exact maximum and minimum values of $g(\\theta) = (\\sin\\theta + \\cos\\theta)^4 + (\\sin\\theta - \\cos\\theta)^4$ and state the exact values of $\\theta$ for $0 \\le \\theta &lt; \\pi$. <span class=\"mk\">[5]<\/span><\/p>","text":" (a) show that ( sin theta + cos theta)^2 = 1 + sin 2 theta . [3] (b) hence or otherwise, prove ( sin theta + cos theta)^4 + ( sin theta - cos theta)^4 = 2 + 2 sin^2 2 theta . [4] (c) hence, determine the exact maximum and minimum values of g( theta) = ( sin theta + cos theta)^4 + ( sin theta - cos theta)^4 and state the exact values of theta for 0 le theta < pi . [5] "},{"id":"c5p1section-1q1","ch":4,"paper":"Probability Worksheet","section":"Section 1","num":1,"marks":1,"est":true,"html":"<p class=\"p\">At a traffic light, the red light is on for 30 s, amber for 5 s, and green for 45 s. What is the probability of arriving when the light is red?<\/p>","text":" at a traffic light, the red light is on for 30 s, amber for 5 s, and green for 45 s. what is the probability of arriving when the light is red? "},{"id":"c5p1section-1q2","ch":4,"paper":"Probability Worksheet","section":"Section 1","num":2,"marks":1,"est":true,"html":"<p class=\"p\">A roulette wheel consists of 38 numbers: 1 to 36, 0, and 00. What is the probability that a roulette ball will come to rest on an even number other than 0 or 00?<\/p>","text":" a roulette wheel consists of 38 numbers: 1 to 36, 0, and 00. what is the probability that a roulette ball will come to rest on an even number other than 0 or 00? "},{"id":"c5p1section-1q3","ch":4,"paper":"Probability Worksheet","section":"Section 1","num":3,"marks":2,"est":true,"html":"<p class=\"p\">A coin showed heads 40 times in 60 tosses.<\/p>\n<p class=\"p part\">(a) What is the experimental probability of a head?<\/p>\n<p class=\"p part\">(b) What is the theoretical probability of a head?<\/p>","text":" a coin showed heads 40 times in 60 tosses. (a) what is the experimental probability of a head? (b) what is the theoretical probability of a head? "},{"id":"c5p1section-1q4","ch":4,"paper":"Probability Worksheet","section":"Section 1","num":4,"marks":2,"est":true,"html":"<p class=\"p\">A coin showed heads 4 times in a row.<\/p>\n<p class=\"p part\">(a) What is the probability of this event?<\/p>\n<p class=\"p part\">(b) Is it more likely, less likely, or just as likely for a tail to appear on the next toss as it was on the first toss?<\/p>","text":" a coin showed heads 4 times in a row. (a) what is the probability of this event? (b) is it more likely, less likely, or just as likely for a tail to appear on the next toss as it was on the first toss? "},{"id":"c5p1section-1q5","ch":4,"paper":"Probability Worksheet","section":"Section 1","num":5,"marks":4,"est":true,"html":"<p class=\"p\">A card is drawn from a shuffled deck of 52 cards. What is the probability that it is each card?<\/p>\n<p class=\"p part\">(a) a red card<span class=\"gap\"><\/span>(b) a face card<span class=\"gap\"><\/span>(c) a spade<span class=\"gap\"><\/span>(d) an ace<\/p>","text":" a card is drawn from a shuffled deck of 52 cards. what is the probability that it is each card? (a) a red card (b) a face card (c) a spade (d) an ace "},{"id":"c5p1section-2q1","ch":4,"paper":"Probability Worksheet","section":"Section 2","num":1,"marks":1,"est":true,"html":"<p class=\"p\">List the sample space for the toss of a coin and the choice of a random digit from 0 to 9.<\/p>","text":" list the sample space for the toss of a coin and the choice of a random digit from 0 to 9. "},{"id":"c5p1section-2q2","ch":4,"paper":"Probability Worksheet","section":"Section 2","num":2,"marks":1,"est":true,"html":"<p class=\"p\">Suppose the probability of precipitation is 0.4. What is its complement? What does it mean?<\/p>","text":" suppose the probability of precipitation is 0.4. what is its complement? what does it mean? "},{"id":"c5p1section-2q3","ch":4,"paper":"Probability Worksheet","section":"Section 2","num":3,"marks":3,"est":true,"html":"<p class=\"p\">An inspector at an egg farm routinely inspects a dozen eggs from each consignment. The inspector records the number of broken eggs as part of the quality control process.<\/p>\n<p class=\"p part\">(a) Describe the outcomes in the event \"at least 3 eggs are broken\".<\/p>\n<p class=\"p part\">(b) Describe the outcomes in the event \"no more than 2 eggs are broken\".<\/p>\n<p class=\"p part\">(c) Describe the complement of the event \"at most 1 egg is broken\".<\/p>","text":" an inspector at an egg farm routinely inspects a dozen eggs from each consignment. the inspector records the number of broken eggs as part of the quality control process. (a) describe the outcomes in the event \"at least 3 eggs are broken\". (b) describe the outcomes in the event \"no more than 2 eggs are broken\". (c) describe the complement of the event \"at most 1 egg is broken\". "},{"id":"c5p1section-2q4","ch":4,"paper":"Probability Worksheet","section":"Section 2","num":4,"marks":8,"est":true,"html":"<p class=\"p\">Two dice are rolled. Determine the probability of each event.<\/p>\n<p class=\"p part\">(a) The difference of the two dice is at least 4.<\/p>\n<p class=\"p part\">(b) The sum of the two dice is less than 4.<\/p>\n<p class=\"p part\">(c) The difference is at least 4 or the sum is less than 4.<\/p>\n<p class=\"p part\">(d) The difference is at least 4 and the sum is less than 4.<\/p>\n<p class=\"p part\">(e) The sum is an even number.<\/p>\n<p class=\"p part\">(f) The sum is either 6 or 12.<\/p>\n<p class=\"p part\">(g) A double is rolled.<\/p>\n<p class=\"p part\">(h) The sum is at least 9.<\/p>","text":" two dice are rolled. determine the probability of each event. (a) the difference of the two dice is at least 4. (b) the sum of the two dice is less than 4. (c) the difference is at least 4 or the sum is less than 4. (d) the difference is at least 4 and the sum is less than 4. (e) the sum is an even number. (f) the sum is either 6 or 12. (g) a double is rolled. (h) the sum is at least 9. "},{"id":"c5p1section-2q5","ch":4,"paper":"Probability Worksheet","section":"Section 2","num":5,"marks":7,"est":true,"html":"<p class=\"p\">One card is drawn from a standard deck of 52 cards.<\/p>\n<p class=\"p part\">(a) Determine the probability of: i. $A$: getting an ace<span class=\"gap\"><\/span>ii. $B$: getting a black card<span class=\"gap\"><\/span>iii. $H$: getting a heart<\/p>\n<p class=\"p part\">(b) Determine each probability: i. $P(H')$<span class=\"gap\"><\/span>ii. $P(A \\cup B)$<span class=\"gap\"><\/span>iii. $P(A \\cap H)$<span class=\"gap\"><\/span>iv. $P(H \\cup B)$<\/p>","text":" one card is drawn from a standard deck of 52 cards. (a) determine the probability of: i. a : getting an ace ii. b : getting a black card iii. h : getting a heart (b) determine each probability: i. p(h') ii. p(a cup b) iii. p(a cap h) iv. p(h cup b) "},{"id":"c5p1section-2q6","ch":4,"paper":"Probability Worksheet","section":"Section 2","num":6,"marks":1,"est":true,"html":"<p class=\"p\">A certain experiment has only 4 outcomes. The probability of each outcome is twice the probability of the preceding outcome. What is the probability of each outcome?<\/p>","text":" a certain experiment has only 4 outcomes. the probability of each outcome is twice the probability of the preceding outcome. what is the probability of each outcome? "},{"id":"c5p1section-3q1","ch":4,"paper":"Probability Worksheet","section":"Section 3","num":1,"marks":1,"est":true,"html":"<p class=\"p\">In a survey, 42% of households contacted owned a home computer and 13% owned a home entertainment system. Eight percent of all households contacted owned both. What is the probability that a household will own neither?<\/p>","text":" in a survey, 42% of households contacted owned a home computer and 13% owned a home entertainment system. eight percent of all households contacted owned both. what is the probability that a household will own neither? "},{"id":"c5p1section-3q2","ch":4,"paper":"Probability Worksheet","section":"Section 3","num":2,"marks":1,"est":true,"html":"<p class=\"p\">A market study found that 50% of a neighbourhood like Japanese food while 60% like Italian food. Thirty percent like both. What is the probability that a resident will like Japanese food but not Italian food?<\/p>","text":" a market study found that 50% of a neighbourhood like japanese food while 60% like italian food. thirty percent like both. what is the probability that a resident will like japanese food but not italian food? "},{"id":"c5p1section-3q3","ch":4,"paper":"Probability Worksheet","section":"Section 3","num":3,"marks":4,"est":true,"html":"<p class=\"p\">A card is drawn from a standard deck of 52 cards. Determine the probability of each event.<\/p>\n<p class=\"p part\">(a) The card is a heart or a spade.<span class=\"gap\"><\/span>(b) The card is an ace or a face card.<span class=\"gap\"><\/span>(c) The card is a heart or a face card.<span class=\"gap\"><\/span>(d) The card is an ace or a spade.<\/p>","text":" a card is drawn from a standard deck of 52 cards. determine the probability of each event. (a) the card is a heart or a spade. (b) the card is an ace or a face card. (c) the card is a heart or a face card. (d) the card is an ace or a spade. "},{"id":"c5p1section-3q4","ch":4,"paper":"Probability Worksheet","section":"Section 3","num":4,"marks":3,"est":true,"html":"<p class=\"p\">A store advertised a sale in the newspaper and on TV. A survey of 200 customers indicated that 60 learned about the sale from the newspaper, 50 from TV, and 30 from both sources. What is the probability of each event?<\/p>\n<p class=\"p part\">(a) A randomly selected customer saw the advertisement in the newspaper and on TV.<\/p>\n<p class=\"p part\">(b) A randomly selected customer saw the advertisement in at least one of the two media.<\/p>\n<p class=\"p part\">(c) A randomly selected customer saw the advertisement in exactly one form.<\/p>","text":" a store advertised a sale in the newspaper and on tv. a survey of 200 customers indicated that 60 learned about the sale from the newspaper, 50 from tv, and 30 from both sources. what is the probability of each event? (a) a randomly selected customer saw the advertisement in the newspaper and on tv. (b) a randomly selected customer saw the advertisement in at least one of the two media. (c) a randomly selected customer saw the advertisement in exactly one form. "},{"id":"c5p1section-3q5","ch":4,"paper":"Probability Worksheet","section":"Section 3","num":5,"marks":6,"est":true,"html":"<p class=\"p\">Determine if the following events are dependent or independent.<\/p>\n<p class=\"p part\">(a) Drawing a queen from a deck of cards and then drawing another queen, with no replacement.<\/p>\n<p class=\"p part\">(b) Drawing a king for the first card and a jack for the second card, with no replacement.<\/p>\n<p class=\"p part\">(c) Tossing a coin and getting a head, then rolling a die and getting 3.<\/p>\n<p class=\"p part\">(d) Rolling a die and getting 6, then rolling it again and getting 1.<\/p>\n<p class=\"p part\">(e) Tossing a coin 10 times and getting a head every time.<\/p>\n<p class=\"p part\">(f) Winning at a solitaire game twice in a row.<\/p>","text":" determine if the following events are dependent or independent. (a) drawing a queen from a deck of cards and then drawing another queen, with no replacement. (b) drawing a king for the first card and a jack for the second card, with no replacement. (c) tossing a coin and getting a head, then rolling a die and getting 3. (d) rolling a die and getting 6, then rolling it again and getting 1. (e) tossing a coin 10 times and getting a head every time. (f) winning at a solitaire game twice in a row. "},{"id":"c5p1section-3q6","ch":4,"paper":"Probability Worksheet","section":"Section 3","num":6,"marks":1,"est":true,"html":"<p class=\"p\">Thirty percent of seniors catch the flu every year. Fifty percent of seniors have yearly flu shots. Ten percent of seniors who have had flu shots get the flu. Are getting a flu shot and getting the flu independent events?<\/p>","text":" thirty percent of seniors catch the flu every year. fifty percent of seniors have yearly flu shots. ten percent of seniors who have had flu shots get the flu. are getting a flu shot and getting the flu independent events? "},{"id":"c5p1section-3q7","ch":4,"paper":"Probability Worksheet","section":"Section 3","num":7,"marks":2,"est":true,"html":"<p class=\"p\">A bag contains 6 white balls and 8 yellow balls. What is the probability of each event?<\/p>\n<p class=\"p part\">(a) drawing 3 white balls<span class=\"gap\"><\/span>(b) drawing 1 yellow ball and 1 white ball<\/p>","text":" a bag contains 6 white balls and 8 yellow balls. what is the probability of each event? (a) drawing 3 white balls (b) drawing 1 yellow ball and 1 white ball "},{"id":"c5p1section-3q8","ch":4,"paper":"Probability Worksheet","section":"Section 3","num":8,"marks":1,"est":true,"html":"<p class=\"p\">The first card drawn from a standard deck of 52 cards is a spade. A second card is then drawn without replacing the first. What is the probability that the second card is a spade?<\/p>","text":" the first card drawn from a standard deck of 52 cards is a spade. a second card is then drawn without replacing the first. what is the probability that the second card is a spade? "},{"id":"c5p1section-3q9","ch":4,"paper":"Probability Worksheet","section":"Section 3","num":9,"marks":1,"est":true,"html":"<p class=\"p\">A biased coin with $P(\\text{Heads}) = 0.7$ was tossed 3 times. The coin came up heads first, then tails twice. What is the probability of this outcome?<\/p>","text":" a biased coin with p( text heads ) = 0.7 was tossed 3 times. the coin came up heads first, then tails twice. what is the probability of this outcome? "},{"id":"c5p1section-3q10","ch":4,"paper":"Probability Worksheet","section":"Section 3","num":10,"marks":3,"est":true,"html":"<p class=\"p\">Two cards are drawn from a standard deck of 52 cards without replacement. Determine the probability of each event.<\/p>\n<p class=\"p part\">(a) The cards are both spades.<span class=\"gap\"><\/span>(b) Neither card is a spade.<span class=\"gap\"><\/span>(c) Exactly one of the two cards is a spade.<\/p>","text":" two cards are drawn from a standard deck of 52 cards without replacement. determine the probability of each event. (a) the cards are both spades. (b) neither card is a spade. (c) exactly one of the two cards is a spade. "},{"id":"c5p1section-4q1","ch":4,"paper":"Probability Worksheet","section":"Section 4","num":1,"marks":6,"est":true,"html":"<p class=\"p\">Two cards are drawn without replacement from a shuffled deck of 52 cards. What is the probability that the second card is each card?<\/p>\n<p class=\"p part\">(a) an ace<span class=\"gap\"><\/span>(b) a club<span class=\"gap\"><\/span>(c) a red card<span class=\"gap\"><\/span>(d) a red face card<span class=\"gap\"><\/span>(e) a black jack<span class=\"gap\"><\/span>(f) the queen of hearts<\/p>","text":" two cards are drawn without replacement from a shuffled deck of 52 cards. what is the probability that the second card is each card? (a) an ace (b) a club (c) a red card (d) a red face card (e) a black jack (f) the queen of hearts "},{"id":"c5p1section-4q2","ch":4,"paper":"Probability Worksheet","section":"Section 4","num":2,"marks":2,"est":true,"html":"<p class=\"p\">There are 100 boys and 120 girls in the grade 12 year. Twenty boys and 30 girls have no siblings. A student is randomly selected.<\/p>\n<p class=\"p part\">(a) What is the probability that the student has no siblings?<\/p>\n<p class=\"p part\">(b) A student is chosen who has no siblings. What is the probability that the student is a girl?<\/p>","text":" there are 100 boys and 120 girls in the grade 12 year. twenty boys and 30 girls have no siblings. a student is randomly selected. (a) what is the probability that the student has no siblings? (b) a student is chosen who has no siblings. what is the probability that the student is a girl? "},{"id":"c5p1section-4q3","ch":4,"paper":"Probability Worksheet","section":"Section 4","num":3,"marks":2,"est":true,"html":"<p class=\"p\">One bag contains 4 white balls and 6 black balls. Another bag contains 8 white balls and 2 black balls. A coin is tossed to select a bag, then a ball is randomly selected from that bag.<\/p>\n<p class=\"p part\">(a) What is the probability that a white ball will be drawn?<\/p>\n<p class=\"p part\">(b) Suppose a white ball was drawn. What is the probability that it came from the first bag?<\/p>","text":" one bag contains 4 white balls and 6 black balls. another bag contains 8 white balls and 2 black balls. a coin is tossed to select a bag, then a ball is randomly selected from that bag. (a) what is the probability that a white ball will be drawn? (b) suppose a white ball was drawn. what is the probability that it came from the first bag? "},{"id":"c5p1section-4q4","ch":4,"paper":"Probability Worksheet","section":"Section 4","num":4,"marks":3,"est":true,"html":"<p class=\"p\">A medical test for glaucoma is 95% accurate. Suppose 0.8% of the population have glaucoma. What is the probability of each event?<\/p>\n<p class=\"p part\">(a) A randomly selected person will test negative.<\/p>\n<p class=\"p part\">(b) A person who tests negative has glaucoma.<\/p>\n<p class=\"p part\">(c) A person who tests positive does not have glaucoma.<\/p>","text":" a medical test for glaucoma is 95% accurate. suppose 0.8% of the population have glaucoma. what is the probability of each event? (a) a randomly selected person will test negative. (b) a person who tests negative has glaucoma. (c) a person who tests positive does not have glaucoma. "},{"id":"c5p1section-5q1","ch":4,"paper":"Probability Worksheet","section":"Section 5","num":1,"marks":3,"est":true,"html":"<p class=\"p\">Three balls are randomly drawn from a bag containing 3 white balls and 5 black balls.<\/p>\n<p class=\"p part\">(a) How many ways are there to choose the 3 balls?<\/p>\n<p class=\"p part\">(b) How many ways are there to choose exactly 2 white balls?<\/p>\n<p class=\"p part\">(c) What is the probability that there are exactly 2 white balls?<\/p>","text":" three balls are randomly drawn from a bag containing 3 white balls and 5 black balls. (a) how many ways are there to choose the 3 balls? (b) how many ways are there to choose exactly 2 white balls? (c) what is the probability that there are exactly 2 white balls? "},{"id":"c5p1section-5q2","ch":4,"paper":"Probability Worksheet","section":"Section 5","num":2,"marks":3,"est":true,"html":"<p class=\"p\">Four people are to be randomly selected from a group of 8 boys and 6 girls. What is the probability of each event?<\/p>\n<p class=\"p part\">(a) Exactly 3 people will be girls.<span class=\"gap\"><\/span>(b) All 4 people will be boys.<span class=\"gap\"><\/span>(c) The four people chosen would alternate in gender.<\/p>","text":" four people are to be randomly selected from a group of 8 boys and 6 girls. what is the probability of each event? (a) exactly 3 people will be girls. (b) all 4 people will be boys. (c) the four people chosen would alternate in gender. "},{"id":"c5p1section-5q3","ch":4,"paper":"Probability Worksheet","section":"Section 5","num":3,"marks":5,"est":true,"html":"<p class=\"p\">Five cards are dealt from a standard deck of 52 cards. What is the probability of each event?<\/p>\n<p class=\"p part\">(a) 2 aces and 3 kings<span class=\"gap\"><\/span>(b) All hearts<span class=\"gap\"><\/span>(c) All hearts in sequence from 10 to ace<span class=\"gap\"><\/span>(d) 4 aces<span class=\"gap\"><\/span>(e) 4 queens and an ace<\/p>","text":" five cards are dealt from a standard deck of 52 cards. what is the probability of each event? (a) 2 aces and 3 kings (b) all hearts (c) all hearts in sequence from 10 to ace (d) 4 aces (e) 4 queens and an ace "},{"id":"c5p1section-5q4","ch":4,"paper":"Probability Worksheet","section":"Section 5","num":4,"marks":1,"est":true,"html":"<p class=\"p\">In a test, 67% of the students answered item 1 correctly, 53% answered item 2 correctly, and 30% answered both items correctly. What is the probability that on a randomly selected test paper there is the correct answer to at least one of the two items?<\/p>","text":" in a test, 67% of the students answered item 1 correctly, 53% answered item 2 correctly, and 30% answered both items correctly. what is the probability that on a randomly selected test paper there is the correct answer to at least one of the two items? "},{"id":"c5p1section-5q5","ch":4,"paper":"Probability Worksheet","section":"Section 5","num":5,"marks":3,"est":true,"html":"<p class=\"p\">Two people are selected from a group of 6 females and 4 males. What is the probability of each event?<\/p>\n<p class=\"p part\">(a) Two females<span class=\"gap\"><\/span>(b) Two males<span class=\"gap\"><\/span>(c) One female and one male<\/p>","text":" two people are selected from a group of 6 females and 4 males. what is the probability of each event? (a) two females (b) two males (c) one female and one male "},{"id":"c5p1section-6q1","ch":4,"paper":"Probability Worksheet","section":"Section 6","num":1,"marks":4,"est":true,"html":"<p class=\"p\">Assume that the births of a boy and a girl are equally likely. In a family of 3 children, determine the probability of each event.<\/p>\n<p class=\"p part\">(a) 3 girls<span class=\"gap\"><\/span>(b) 2 girls and 1 boy<span class=\"gap\"><\/span>(c) 1 girl and 2 boys<span class=\"gap\"><\/span>(d) 3 boys<\/p>","text":" assume that the births of a boy and a girl are equally likely. in a family of 3 children, determine the probability of each event. (a) 3 girls (b) 2 girls and 1 boy (c) 1 girl and 2 boys (d) 3 boys "},{"id":"c5p1section-6q2","ch":4,"paper":"Probability Worksheet","section":"Section 6","num":2,"marks":1,"est":true,"html":"<p class=\"p\">Suppose an archer could hit a target 80% of the time. What is the probability that the archer would hit the target 9 times out of 10?<\/p>","text":" suppose an archer could hit a target 80% of the time. what is the probability that the archer would hit the target 9 times out of 10? "},{"id":"c5p1section-6q3","ch":4,"paper":"Probability Worksheet","section":"Section 6","num":3,"marks":1,"est":true,"html":"<p class=\"p\">The Canucks and the Bruins are in the finals, which is a best-of-seven series. The probability of a Canucks win in any game is 80%. What is the probability that the Canucks will win the series in exactly 6 games?<\/p>","text":" the canucks and the bruins are in the finals, which is a best-of-seven series. the probability of a canucks win in any game is 80%. what is the probability that the canucks will win the series in exactly 6 games? "},{"id":"c5p1section-6q4","ch":4,"paper":"Probability Worksheet","section":"Section 6","num":4,"marks":1,"est":true,"html":"<p class=\"p\">Jim has scored a goal in 70% of the games he played. What is the probability that he would score a goal in at least 7 of his next 8 games?<\/p>","text":" jim has scored a goal in 70% of the games he played. what is the probability that he would score a goal in at least 7 of his next 8 games? "},{"id":"c5p1section-6q5","ch":4,"paper":"Probability Worksheet","section":"Section 6","num":5,"marks":1,"est":true,"html":"<p class=\"p\">The probability of rain for any day in March is 70%. What is the probability that it will rain at most 5 days in a week in March?<\/p>","text":" the probability of rain for any day in march is 70%. what is the probability that it will rain at most 5 days in a week in march? "}]}</script>

// ---------- helpers
function $(s, r){ return (r || document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function sum(a, f){ return a.reduce(function(t, x){ return t + f(x); }, 0); }
var store = {
  get: function(k, d){ try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set: function(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
function fmt(s){
  var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  var mm = h ? String(m).padStart(2, '0') : m;
  return (h ? h + ':' : '') + mm + ':' + String(x).padStart(2, '0');
}
function shuffle(a){ for (var i = a.length - 1; i > 0; i--){ var j = Math.random() * (i + 1) | 0, t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function source(q){
  return CH[q.ch].title + ' · ' + q.paper + (q.section ? ' · ' + q.section : '') + ' · Question ' + q.num;
}
function marksLabel(q){ return (q.est ? '≈ ' : '') + q.marks + (q.marks === 1 ? ' mark' : ' marks'); }

  if (window.renderMathInElement)
    renderMathInElement(el, { delimiters: [{ left: '$', right: '$', display: false }], throwOnError: false });
  else setTimeout(function(){ typeset(el); }, 60);

  ok: '<svg class="ic" viewBox="0 0 20 20"><circle cx="10" cy="10" r="10" fill="var(--green)"/><path d="M5.6 10.4l2.9 2.9 5.9-6.3" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  bad: '<svg class="ic" viewBox="0 0 20 20"><circle cx="10" cy="10" r="10" fill="var(--red)"/><path d="M6.8 6.8l6.4 6.4M13.2 6.8l-6.4 6.4" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>',
  part: '<svg class="ic" viewBox="0 0 20 20"><circle cx="10" cy="10" r="10" fill="var(--amber)"/><path d="M6 10h8" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>',
  flag: '<svg class="ic" viewBox="0 0 20 20"><circle cx="10" cy="10" r="10" fill="var(--amber)"/><path d="M7 15V5.5h6.5l-1.6 2.6 1.6 2.6H7" stroke="#fff" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/></svg>',
  none: '<svg class="ic" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="var(--card)" stroke="var(--line)" stroke-width="1.6"/></svg>'
};

// ---------- theme
var root = document.documentElement, savedTheme = store.get('tb2-theme', null);
if (savedTheme) root.setAttribute('data-theme', savedTheme);
$('#theme').onclick = function(){
  var cur = root.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  var next = cur === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next); store.set('tb2-theme', next);
};

// ---------- dialog
function ask(title, text, yes){
  var d = $('#dlg');
  $('#dlgT').textContent = title; $('#dlgP').textContent = text; $('#dlgYes').textContent = yes || 'OK';
  return new Promise(function(res){
    function done(v){ d.close(); $('#dlgYes').onclick = $('#dlgNo').onclick = null; res(v); }
    $('#dlgYes').onclick = function(){ done(true); };
    $('#dlgNo').onclick = function(){ done(false); };
    d.oncancel = function(e){ e.preventDefault(); done(false); };
    d.showModal();
  });
}

// ---------- state
var cfg = store.get('tb2-cfg', null) || { topics: CH.map(function(_, i){ return i; }), marks: 40, est: true };
function saveCfg(){ store.set('tb2-cfg', cfg); }
function getTest(){ return store.get('tb2-test', null); }
function saveTest(t){ store.set('tb2-test', t); }
function clockNow(t){ return t.pausedAt || Date.now(); }
function remaining(t){ return Math.max(0, Math.round((t.start + t.limit * 1000 + (t.paused || 0) - clockNow(t)) / 1000)); }
function togglePause(){
  var t = getTest(); if (!t || t.finished) return;
  if (t.pausedAt){ t.paused = (t.paused || 0) + (Date.now() - t.pausedAt); delete t.pausedAt; }
  else t.pausedAt = Date.now();
  saveTest(t); viewTest(); typeset(view);
}

function pool(){
  return Q.filter(function(q){ return cfg.topics.indexOf(q.ch) !== -1 && (cfg.est || !q.est); });
}
// pick questions whose marks sum as close to target as possible without going over
function pick(items, target){
  var a = shuffle(items.slice()), from = new Array(target + 1);
  from[0] = -1;
  a.forEach(function(q, i){
    for (var s = target; s >= q.marks; s--)
      if (from[s] === undefined && from[s - q.marks] !== undefined) from[s] = i;
  });
  var s = target; while (s > 0 && from[s] === undefined) s--;
  var out = [];
  while (s > 0){ var i = from[s]; out.push(a[i]); s -= a[i].marks; }
  return out;
}
function startTest(ids, label){
  var qs = ids.map(function(id){ return byId[id]; });
  var total = sum(qs, function(q){ return q.marks; });
  var t = { id: Date.now(), ids: ids, label: label, start: Date.now(), limit: total * 60, total: total,
            idx: 0, status: {}, notes: {}, awarded: {}, finished: false };
  saveTest(t);
  location.hash = '#/test';
}
function finishTest(timedOut){
  var t = getTest(); if (!t || t.finished) return;
  t.finished = true; t.timedOut = !!timedOut;
  t.used = Math.min(t.limit, Math.round((clockNow(t) - t.start - (t.paused || 0)) / 1000));
  saveTest(t); saveHistory(t);
  location.hash = '#/results';
}
function scoreOf(t){
  var got = 0, marked = 0;
  t.ids.forEach(function(id){ if (t.awarded[id] != null){ got += t.awarded[id]; marked++; } });
  return { got: got, marked: marked, pct: t.total ? got / t.total * 100 : 0 };
}
function saveHistory(t){
  var h = store.get('tb2-history', []), s = scoreOf(t);
  var row = { id: t.id, label: t.label, total: t.total, got: s.got, marked: s.marked, n: t.ids.length, date: t.start };
  var i = h.findIndex(function(x){ return x.id === t.id; });
  if (i === -1) h.unshift(row); else h[i] = row;
  store.set('tb2-history', h.slice(0, 30));
}

// ---------- views
function viewHome(){
  var t = getTest(), hist = store.get('tb2-history', []);
  var cards = CH.map(function(c, i){
    var qs = Q.filter(function(q){ return q.ch === i; });
    var est = qs.filter(function(q){ return q.est; }).length;
    return '<button class="topic" data-topic="' + i + '" aria-pressed="' + (cfg.topics.indexOf(i) !== -1) + '">' +
      '<span class="box"></span><div><strong>' + esc(c.title) + '</strong><span>' + qs.length + ' questions' +
      (est === qs.length ? ' · marks estimated' : '') + '</span></div></button>';
  }).join('');
  var presets = [10, 20, 30, 40, 60, 80].map(function(m){
    return '<button class="chip" data-preset="' + m + '">' + m + '</button>';
  }).join('');
  var banner = t && !t.finished ?
    '<div class="banner"><div><b>Test ' + (t.pausedAt ? 'paused' : 'in progress') + '</b> · ' + esc(t.label) + ' · <span class="t-val"></span> left</div>' +
    '<a class="btn" style="text-decoration:none;text-align:center" href="#/test">Resume</a></div>' : '';

  var done = hist.filter(function(h){ return h.marked; });
  var avg = done.length ? sum(done, function(h){ return h.got / h.total * 100; }) / done.length : null;
  var histRows = hist.slice(0, 6).map(function(h){
    var pct = h.marked ? h.got / h.total * 100 : null;
    var ic = pct == null ? ico.none : pct >= 70 ? ico.ok : pct >= 40 ? ico.part : ico.bad;
    return '<div class="qrow' + (pct == null ? ' idle' : '') + '">' + ic + '<span>' + esc(h.label) + '</span>' +
      '<span class="m">' + (pct == null ? 'unmarked' : pct.toFixed(0) + '%') + '</span></div>';
  }).join('') || '<p class="empty">Your finished tests will appear here.</p>';

  view.innerHTML =
    '<div class="grid"><section>' + banner +
    '<h1>Generate a test</h1><p class="sub">Pick the topics, set the marks, and you get one minute per mark.</p>' +
    '<div class="section-label">Topics</div><div class="topics">' + cards + '</div>' +
    '<div class="section-label">Total marks</div>' +
    '<div class="row"><input type="range" id="marks" min="5" max="150" step="1" value="' + cfg.marks + '">' +
    '<input class="num" id="marksNum" type="number" min="5" max="150" value="' + cfg.marks + '"></div>' +
    '<div class="chips" style="margin-top:12px">' + presets + '</div>' +
    '<label class="check"><input type="checkbox" id="est"' + (cfg.est ? ' checked' : '') + '><span>Include questions without printed marks ' +
    '<span class="empty">(the probability worksheet and most of Logarithmics 2023–24 — marks are estimated)</span></span></label>' +
    '<div class="summary" id="summary"></div><div id="warn"></div>' +
    '<div class="actions"><button class="btn wide" id="go">Start test</button></div>' +
    '</section><aside>' +
    '<div class="score"><div class="big">' + (avg == null ? '—' : avg.toFixed(1) + '%') + '</div>' +
    '<div class="small">' + (done.length ? 'Average over ' + done.length + ' marked test' + (done.length > 1 ? 's' : '') : 'No marked tests yet') + '</div></div>' +
    '<div class="section-label" style="margin:0 0 2px">Recent tests</div><div class="hist">' + histRows + '</div>' +
    '</aside></div>';
  updateSummary();
}
function updateSummary(){
  var p = pool(), avail = sum(p, function(q){ return q.marks; });
  var target = Math.min(cfg.marks, avail);
  $('#summary').innerHTML =
    '<div><b>' + target + '</b><small>marks</small></div>' +
    '<div><b>' + fmt(target * 60).replace(/:00$/, '') + '</b><small>' + (target * 60 >= 3600 ? 'hours : minutes' : 'minutes') + '</small></div>' +
    '<div><b>' + p.length + '</b><small>questions in pool</small></div>' +
    '<div><b>' + avail + '</b><small>marks available</small></div>';
  var w = '';
  if (!cfg.topics.length) w = 'Choose at least one topic.';
  else if (!p.length) w = 'These topics only have questions with estimated marks — tick the box above to include them.';
  else if (cfg.marks > avail) w = 'Only ' + avail + ' marks are available for these topics, so the test will use every question.';
  $('#warn').innerHTML = w ? '<div class="alert">' + w + '</div>' : '';
  $('#go').disabled = !p.length;
  $$('.chip[data-preset]').forEach(function(c){ c.classList.toggle('on', +c.dataset.preset === cfg.marks); });
}
function setMarks(v){
  cfg.marks = Math.max(5, Math.min(150, Math.round(+v) || 5));
  $('#marks').value = cfg.marks;
  if (document.activeElement !== $('#marksNum')) $('#marksNum').value = cfg.marks;
  saveCfg(); updateSummary();
}

function sideTest(t){
  var r = remaining(t);
  var rows = t.ids.map(function(id, i){
    var st = t.status[id], q = byId[id];
    return '<button class="qrow' + (i === t.idx ? ' cur' : '') + (!st && i !== t.idx ? ' idle' : '') + '" data-go="' + i + '">' +
      (st === 'done' ? ico.ok : st === 'flag' ? ico.flag : ico.none) + '<span>Question ' + (i + 1) + '</span><span class="m">' + q.marks + '</span></button>';
  }).join('');
  return '<div class="score" id="clock"><div class="big t-val">' + fmt(r) + '</div><div class="small">left of ' +
    fmt(t.limit).replace(/:00$/, '') + ' · ' + t.total + ' marks</div>' +
    '<button class="pause" data-act="pause">' + (t.pausedAt ? 'Resume' : 'Pause') + '</button></div><div class="qlist">' + rows + '</div>' +
    '<button class="btn ghost" data-act="finish" style="width:100%;margin-top:6px">Finish test</button>';
}
function viewTest(){
  var t = getTest();
  if (!t){ location.hash = '#/'; return; }
  if (t.finished){ location.hash = '#/results'; return; }
  var q = byId[t.ids[t.idx]], n = t.ids.length, st = t.status[q.id];
  var doneN = t.ids.filter(function(id){ return t.status[id] === 'done'; }).length;
  var pct = Math.round(doneN / n * 100);
  view.innerHTML =
    '<div class="grid"><section>' +
    '<h1>' + esc(t.label) + '</h1>' +
    '<div class="progress"><div class="track"><i style="width:' + pct + '%"></i></div><span>' + pct + '%</span></div>' +
    '<div class="qhead"><b>Question ' + (t.idx + 1) + '/' + n + ':</b><span class="pill' + (q.est ? ' est' : '') + '">' + marksLabel(q) + '</span>' +
    '<span class="pill only-narrow t-val"></span></div>' +
    (t.pausedAt ? '<div class="paused-cover"><p>Test paused · ' + fmt(remaining(t)) + ' left</p><button class="btn" data-act="pause">Resume</button></div>' :
    '<div class="qbody">' + q.html + '</div>') +
    '<details class="src"><summary>Source</summary><p>' + esc(source(q)) + '</p></details>' +
    '<div class="opts">' +
    '<button class="opt" data-act="done" aria-pressed="' + (st === 'done') + '">' + (st === 'done' ? ico.ok : ico.none) + 'I’ve answered this question</button>' +
    '<button class="opt" data-act="flag" aria-pressed="' + (st === 'flag') + '">' + (st === 'flag' ? ico.flag : ico.none) + 'Flag to come back to</button>' +
    '<textarea class="notes" id="notes" placeholder="Scratch notes (optional, saved in this browser). Write full working on paper.">' + esc(t.notes[q.id] || '') + '</textarea>' +
    '</div>' +
    '<div class="actions"><button class="btn ghost" data-act="prev"' + (t.idx ? '' : ' disabled') + '>Previous</button>' +
    '<button class="btn" data-act="' + (t.idx === n - 1 ? 'finish' : 'next') + '">' + (t.idx === n - 1 ? 'Finish' : 'Next') + '</button></div>' +
    '</section><aside id="side">' + sideTest(t) + '</aside></div>';
  tick();
  var cur = $('.qrow.cur'); if (cur) cur.scrollIntoView({ block: 'nearest' });
}

function rowIcon(t, id){
  var a = t.awarded[id], m = byId[id].marks;
  return a == null ? ico.none : a >= m ? ico.ok : a === 0 ? ico.bad : ico.part;
}
function sideResults(t){
  var s = scoreOf(t);
  var rows = t.ids.map(function(id, i){
    return '<button class="qrow' + (t.awarded[id] == null ? ' idle' : '') + '" data-jump="' + id + '">' + rowIcon(t, id) +
      '<span>Question ' + (i + 1) + '</span><span class="m">' + (t.awarded[id] == null ? '–' : t.awarded[id]) + ' / ' + byId[id].marks + '</span></button>';
  }).join('');
  return '<div class="score"><div class="big">' + s.pct.toFixed(1) + '%</div><div class="small">You scored ' + s.got + ' / ' + t.total + ' marks' +
    (s.marked < t.ids.length ? ' · ' + (t.ids.length - s.marked) + ' still to mark' : '') + '</div></div>' +
    '<div class="qlist">' + rows + '</div>';
}
function viewResults(){
  var t = getTest();
  if (!t){ location.hash = '#/'; return; }
  if (!t.finished){ location.hash = '#/test'; return; }
  var cards = t.ids.map(function(id, i){
    var q = byId[id], a = t.awarded[id];
    return '<article class="card" id="r-' + id + '"><header><span class="st">' + rowIcon(t, id) + '</span><b>Question ' + (i + 1) + '</b>' +
      '<span class="pill' + (q.est ? ' est' : '') + '">' + marksLabel(q) + '</span>' +
      (t.status[id] === 'flag' ? '<span class="pill est">flagged</span>' : '') +
      '<div class="award"><input class="num" type="number" min="0" max="' + q.marks + '" step="1" data-aw="' + id + '" value="' + (a == null ? '' : a) + '" placeholder="–" aria-label="Marks awarded">' +
      '<span class="empty">/ ' + q.marks + '</span><button class="chip" data-full="' + id + '">Full</button><button class="chip" data-zero="' + id + '">0</button></div></header>' +
      '<div class="meta" style="color:var(--muted);font-size:.8rem;margin-top:4px">' + esc(source(q)) + '</div>' +
      (t.notes[id] ? '<p style="white-space:pre-wrap;font-size:.88rem;background:var(--blue-soft);padding:8px 12px;border-radius:6px">' + esc(t.notes[id]) + '</p>' : '') +
      '<details><summary>Show question</summary><div class="qbody">' + q.html + '</div></details></article>';
  }).join('');
  view.innerHTML =
    '<div class="grid"><section>' +
    '<h1>' + (t.timedOut ? 'Time’s up' : 'Test complete') + '</h1>' +
    '<p class="sub">' + esc(t.label) + ' · ' + t.ids.length + ' questions · ' + fmt(t.used) + ' used of ' + fmt(t.limit) + '</p>' +
    '<div class="alert" style="margin:0 0 20px">There are no mark schemes in this bank. Check your working against your class solutions, then enter the marks you earned for each question.</div>' +
    cards +
    '<div class="actions"><button class="btn ghost" data-act="retake">Retake these questions</button><a class="btn" style="text-decoration:none;text-align:center" href="#/">New test</a></div>' +
    '</section><aside id="side">' + sideResults(t) + '</aside></div>';
}
function award(id, v){
  var t = getTest(), m = byId[id].marks;
  if (v === '' || v == null) delete t.awarded[id];
  else t.awarded[id] = Math.max(0, Math.min(m, Math.round(+v)));
  saveTest(t); saveHistory(t);
  var inp = $('[data-aw="' + id + '"]');
  if (inp && document.activeElement !== inp) inp.value = t.awarded[id] == null ? '' : t.awarded[id];
  $('#r-' + id + ' .st').innerHTML = rowIcon(t, id);
  $('#side').innerHTML = sideResults(t);
}

var bankState = { ch: -1, term: '' };
function bankQuestion(q, withSource){
  return '<article class="bank-q"><header><b>' + (withSource ? esc(source(q)) : 'Question ' + q.num) + '</b>' +
    '<span class="pill' + (q.est ? ' est' : '') + '">' + marksLabel(q) + '</span></header><div class="qbody">' + q.html + '</div></article>';
}
function viewBank(){
  var chips = '<button class="chip' + (bankState.ch === -1 ? ' on' : '') + '" data-bch="-1">All</button>' +
    CH.map(function(c, i){ return '<button class="chip' + (bankState.ch === i ? ' on' : '') + '" data-bch="' + i + '">' + esc(c.title) + '</button>'; }).join('');
  view.innerHTML = '<div style="margin-top:40px"><h1>Question bank</h1><p class="sub">' + Q.length + ' questions across ' + CH.length + ' topics.</p>' +
    '<div class="filters"><input class="search" id="bsearch" type="search" placeholder="Search questions…" value="' + esc(bankState.term) + '"></div>' +
    '<div class="chips" style="margin-bottom:22px">' + chips + '</div><div id="blist"></div></div>';
  renderBankList();
}
function renderBankList(){
  var box = $('#blist'), term = bankState.term.trim().toLowerCase();
  var qs = Q.filter(function(q){ return bankState.ch === -1 || q.ch === bankState.ch; });
  if (term){
    var hits = qs.filter(function(q){ return q.text.indexOf(term) !== -1; });
    box.innerHTML = hits.length ? '<div class="paper" open><div class="inner">' + hits.slice(0, 60).map(function(q){ return bankQuestion(q, true); }).join('') + '</div></div>' +
      (hits.length > 60 ? '<p class="empty">Showing 60 of ' + hits.length + ' matches.</p>' : '') : '<p class="empty">No questions match.</p>';
    typeset(box); return;
  }
  var papers = [], seen = {};
  qs.forEach(function(q){
    var k = q.ch + '|' + q.paper;
    if (!seen[k]){ seen[k] = { ch: q.ch, paper: q.paper, qs: [] }; papers.push(seen[k]); }
    seen[k].qs.push(q);
  });
  box.innerHTML = papers.map(function(p, i){
    var total = sum(p.qs, function(q){ return q.marks; }), est = p.qs.some(function(q){ return q.est; });
    return '<details class="paper" data-p="' + i + '"><summary>' + esc(p.paper) + '<span>' + p.qs.length + ' questions · ' + (est ? '≈ ' : '') + total + ' marks</span></summary><div class="inner"></div></details>';
  }).join('');
  $$('details.paper', box).forEach(function(d){
    d.addEventListener('toggle', function(){
      var inner = $('.inner', d);
      if (!d.open || inner.childNodes.length) return;
      var sec = '';
      inner.innerHTML = papers[+d.dataset.p].qs.map(function(q){
        var h = q.section && q.section !== sec ? '<h4 class="sec">' + esc(q.section) + '</h4>' : '';
        sec = q.section; return h + bankQuestion(q, false);
      }).join('');
      typeset(inner);
    });
  });
}

// ---------- router
function route(){
  var r = (location.hash.replace(/^#\/?/, '') || 'home').split('?')[0];
  if (r === 'results') r = 'results';
  $$('.nav a.link').forEach(function(a){ a.classList.toggle('on', a.dataset.route === (r === 'results' ? 'test' : r)); });
  var t = getTest();
  $('#navTest').hidden = !(t && (!t.finished || r === 'results'));
  $('#navTest').textContent = t && t.finished ? 'Results' : 'Test';
  $('#navTest').href = t && t.finished ? '#/results' : '#/test';
  ({ home: viewHome, bank: viewBank, test: viewTest, results: viewResults }[r] || viewHome)();
  typeset(view);
  window.scrollTo(0, 0);
  tick();
}
window.addEventListener('hashchange', route);

// ---------- timer
function tick(){
  var t = getTest();
  if (!t || t.finished) return;
  var r = remaining(t);
  $$('.t-val').forEach(function(el){ el.textContent = fmt(r); });
  var clock = $('#clock');
  if (clock){ clock.classList.toggle('warn', r <= 300 && r > 60); clock.classList.toggle('danger', r <= 60); }
  if (r === 0) finishTest(true);
}
setInterval(tick, 1000);

// ---------- events
view.addEventListener('click', function(e){
  var el = e.target.closest('button, [data-go]'); if (!el) return;
  var t = getTest();
  if (el.dataset.topic != null){
    var i = +el.dataset.topic, k = cfg.topics.indexOf(i);
    if (k === -1) cfg.topics.push(i); else cfg.topics.splice(k, 1);
    el.setAttribute('aria-pressed', k === -1); saveCfg(); updateSummary(); return;
  }
  if (el.dataset.preset){ setMarks(el.dataset.preset); return; }
  if (el.id === 'go'){
    var go = function(){
      var p = pool(), qs = pick(p, Math.min(cfg.marks, sum(p, function(q){ return q.marks; })));
      qs.sort(function(a, b){ return a.ch - b.ch; });
      var names = CH.filter(function(_, i){ return cfg.topics.indexOf(i) !== -1; }).map(function(c){ return c.title; });
      var label = names.length === CH.length ? 'Mixed test' : names.length > 2 ? names.length + '-topic test' : names.join(' & ');
      startTest(qs.map(function(q){ return q.id; }), label);
    };
    if (t && !t.finished) ask('Replace your current test?', 'You have a test in progress. Starting a new one will discard it.', 'Start new test').then(function(ok){ if (ok) go(); });
    else go();
    return;
  }
  if (el.dataset.go != null){ t.idx = +el.dataset.go; saveTest(t); viewTest(); typeset(view); return; }
  if (el.dataset.jump){ var c = $('#r-' + el.dataset.jump); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (el.dataset.full){ award(el.dataset.full, byId[el.dataset.full].marks); return; }
  if (el.dataset.zero){ award(el.dataset.zero, 0); return; }
  if (el.dataset.bch != null){ bankState.ch = +el.dataset.bch; viewBank(); return; }
  var act = el.dataset.act;
  if (act === 'pause'){ togglePause(); return; }
  if (act === 'prev' || act === 'next'){ t.idx += act === 'next' ? 1 : -1; saveTest(t); viewTest(); typeset(view); window.scrollTo(0, 0); }
  else if (act === 'done' || act === 'flag'){
    var id = t.ids[t.idx]; t.status[id] = t.status[id] === act ? undefined : act; saveTest(t);
    $$('.opt[data-act]').forEach(function(b){
      var on = t.status[id] === b.dataset.act;
      b.setAttribute('aria-pressed', on); b.querySelector('.ic').outerHTML = on ? ico[b.dataset.act === 'done' ? 'ok' : 'flag'] : ico.none;
    });
    $('#side').innerHTML = sideTest(t); tick();
    var n = t.ids.length, pct = Math.round(t.ids.filter(function(x){ return t.status[x] === 'done'; }).length / n * 100);
    $('.progress i').style.width = pct + '%'; $('.progress span').textContent = pct + '%';
  }
  else if (act === 'finish'){
    var left = t.ids.filter(function(x){ return t.status[x] !== 'done'; }).length;
    ask('Finish the test?', left ? left + ' question' + (left > 1 ? 's are' : ' is') + ' not marked as answered. You have ' + fmt(remaining(t)) + ' left.' : 'You have ' + fmt(remaining(t)) + ' left.', 'Finish')
      .then(function(ok){ if (ok) finishTest(false); });
  }
  else if (act === 'retake'){
    var lbl = t.label.replace(/ \(retake\)$/, '') + ' (retake)';
    startTest(t.ids.slice(), lbl);
  }
});
view.addEventListener('input', function(e){
  var el = e.target;
  if (el.id === 'marks') setMarks(el.value);
  else if (el.id === 'marksNum'){ if (el.value !== '') setMarks(el.value); }
  else if (el.id === 'notes'){ var t = getTest(); t.notes[t.ids[t.idx]] = el.value; saveTest(t); }
  else if (el.dataset.aw) award(el.dataset.aw, el.value);
  else if (el.id === 'bsearch'){ bankState.term = el.value; renderBankList(); }
});
view.addEventListener('change', function(e){
  var el = e.target;
  if (el.id === 'est'){ cfg.est = el.checked; saveCfg(); updateSummary(); }
  if (el.id === 'marksNum') setMarks(el.value);
  if (el.dataset.aw){ var t = getTest(), v = t.awarded[el.dataset.aw]; el.value = v == null ? '' : v; }
});
document.addEventListener('keydown', function(e){
  if (!/^#\/test/.test(location.hash) || /TEXTAREA|INPUT/.test(e.target.tagName) || $('#dlg').open) return;
  var b = e.key === 'ArrowRight' ? $('[data-act="next"]') : e.key === 'ArrowLeft' ? $('[data-act="prev"]:not(:disabled)') : null;
  if (b) b.click();
});

function h(s){ var x = 5381; for (var i = 0; i < s.length; i++) x = (x * 33 ^ s.charCodeAt(i)) >>> 0; return x; }
var KEY = 2088100024;
function unlock(){ document.body.classList.remove('locked'); $('#gate').remove(); route(); }
if (store.get('tb2-ok', 0) === KEY) unlock();
else $('#gateForm').onsubmit = function(e){
  e.preventDefault();
  var v = $('#pw').value.trim().toLowerCase();
  if (h(v) === KEY){ store.set('tb2-ok', KEY); unlock(); }
  else { $('#pwErr').textContent = 'Not quite. Try again.'; $('#pw').select(); }
};
})();
</script>
</body>
